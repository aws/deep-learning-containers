[extend]
useDefault = true

# Checksums, commit SHAs and key fingerprints are public values, not secrets.
[[allowlists]]
description = "Lambda DLC dependency checksums and key fingerprints"
paths = ['''docker/lambda/Dockerfile''']
regexes = [
  '''ARG \w*(SHA256|DIGEST|COMMIT|GPG_KEY)\w*=(sha256:)?[0-9a-fA-F]{40,64}''',
]

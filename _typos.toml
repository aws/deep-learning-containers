[default]
# Short vLLM commit hashes in version strings and docs data file names, e.g. 0.33.0+amzn2023.4ba787ec
# Local version segments such as "+g4dbe5a4c" are git short hashes.
extend-ignore-re = ["amzn2023\\.[0-9a-f]{8}", "\\+g[0-9a-f]{7,40}"]

[default.extend-words]
WHT = "WHT"
arange = "arange"
certifi = "certifi"

account_id: &ACCOUNT_ID <set-$ACCOUNT_ID-in-environment>
region: &REGION <set-$REGION-in-environment>
base_framework: &BASE_FRAMEWORK pytorch
framework: &FRAMEWORK !join ["huggingface_", *BASE_FRAMEWORK]
version: &VERSION 2.14.0
short_version: &SHORT_VERSION "2.14"
contributor: huggingface
arch_type: x86

repository_info:
  training_repository: &TRAINING_REPOSITORY
    image_type: &TRAINING_IMAGE_TYPE training
    root: !join ["huggingface/", *BASE_FRAMEWORK, "/", *TRAINING_IMAGE_TYPE]
    repository_name: &REPOSITORY_NAME pr-huggingface-pytorch-training-neuronx
    repository: !join [*ACCOUNT_ID, ".dkr.ecr.", *REGION, ".amazonaws.com/", *REPOSITORY_NAME]

context:
  setup_oss_compliance:
    source: ../../../scripts/setup_oss_compliance.sh
    target: setup_oss_compliance.sh

images:
  BuildNeuronHFPytorchPy314TrainingDockerImage:
    <<: *TRAINING_REPOSITORY
    build: &HUGGINGFACE_PYTORCH_NEURONX_TRAINING_PY3 false
    image_size_baseline: 40000
    device_type: &DEVICE_TYPE neuronx
    python_version: &DOCKER_PYTHON_VERSION py3
    tag_python_version: &TAG_PYTHON_VERSION py314
    neuron_sdk_version: &NEURON_SDK_VERSION sdk2.33.0
    os_version: &OS_VERSION ubuntu26.04
    transformers_version: &TRANSFORMERS_VERSION 5.21.0
    datasets_version: &DATASETS_VERSION 5.1.0
    tag: !join [*VERSION, "-transformers", *TRANSFORMERS_VERSION, "-", *DEVICE_TYPE, "-", *TAG_PYTHON_VERSION, "-", *NEURON_SDK_VERSION, "-", *OS_VERSION, "-ec2"]
    docker_file: !join ["docker/", *SHORT_VERSION, "/", *DOCKER_PYTHON_VERSION, "/", *NEURON_SDK_VERSION, "/Dockerfile.", *DEVICE_TYPE]
    build_args:
      BASE_IMAGE: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
      HUGGINGFACE_HUB_VERSION: "1.33.0"
      HF_XET_VERSION: "1.7.0"
      ACCELERATE_VERSION: "1.15.0"
      PEFT_VERSION: "0.21.2"
      TRL_VERSION: "1.16.0"
      DIFFUSERS_VERSION: "0.41.0"
      EVALUATE_VERSION: "0.4.6"
      DLC_MAJOR_VERSION: "1"
    test_configs:
      test_platforms: [sanity, security]

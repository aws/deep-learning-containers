[project]
name = "dlc-base-cu130"
version = "2.0.0"
requires-python = "==3.13.*"
dependencies = [
    # botocore and packaging are required by the DLC telemetry script
    # (scripts/docker/telemetry/deep_learning_container.py): botocore for EC2
    # instance tagging, packaging for framework-version validation.
    "botocore",
    "packaging",
    "requests",
    # certifi and urllib3 are transitive (via requests); pinned with a floor
    # to keep the CA bundle and HTTP stack on a patched release.
    "certifi>=2026.10.18",
    "urllib3>=2.8.0",
]

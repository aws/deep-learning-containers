[project]
name = "pytorch-dlc"
version = "2.13.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchaudio==2.11.0",
    "deepspeed==0.19.2",
    "fastai",
    "boto3",
    "botocore",
    "pyyaml",
    "requests",
    "packaging",
    "urllib3>=2.8.0",  # CVE-2026-97687, CVE-2026-97689
    "python-multipart>=0.0.30",
    "starlette>=1.3.1",
    # CVE-2026-87817, CVE-2026-114145, GHSA-23mf-xhv8-69c2, GHSA-f9j4-qggq-h239,
    # GHSA-m64x-33q8-m5h7, GHSA-w8jc-g24h-crhw
    "GitPython>=3.2.1",
    "Mako>=1.3.12",
    "msgpack>=1.2.3",  # CVE GHSA-6v7p-g79w-8964, CVE-2026-114613 (transitive via deepspeed)
    "soupsieve>=2.9",  # CVE GHSA-2wc2-fm75-p42x, GHSA-836r-79rf-4m37 (transitive via beautifulsoup4 -> python-fasthtml -> fastai)
    "click>=8.3.3",  # CVE-2026-7246 (transitive)
    # CVE-2026-55379, CVE-2026-96639, CVE-2026-96640, CVE-2026-96644, CVE-2026-96778,
    # CVE-2026-112390, CVE-2026-112391, CVE-2026-112392, CVE-2026-112393, CVE-2026-112394,
    # CVE-2026-112395, CVE-2026-112396, CVE-2026-112397, CVE-2026-112398, CVE-2026-112399,
    # CVE-2026-112400, CVE-2026-112401, CVE-2026-112402, CVE-2026-112403, CVE-2026-112404,
    # CVE-2026-112405, CVE-2026-112406, CVE-2026-112891, CVE-2026-112892, CVE-2026-112893,
    # CVE-2026-112894, CVE-2026-112895, CVE-2026-112896, CVE-2026-112900, CVE-2026-112901,
    # GHSA-78g4-xqwv-q3g8, GHSA-xvh5-g6gv-559v (transitive via torchvision / fastai)
    "pillow>=13.0.0",
    "anyio>=4.14.2",  # CVE-2026-63374 (transitive via starlette)
    "certifi>=2026.10.18",  # GHSA-6q48-6c7w-9gw2 (transitive)
    "fsspec>=2026.6.0",  # CVE-2026-104851 (transitive via torch)
    "filelock>=4.2.1",  # CVE-2026-112940 (transitive via torch)
    "oauthlib>=4.0.0",  # GHSA-3jp2-3mrg-2vxc (transitive via fastai / python-fasthtml)
]

[project.optional-dependencies]
sagemaker = [
    "smclarify",
    "sagemaker>=3.4.0",
    "sagemaker-pytorch-training",
    "sagemaker-training",
    "mlflow>=3.17.2",  # CVE-2026-53995, CVE-2026-116690, CVE-2026-116692; relaxes cryptography cap to <51, unblocking CVE-2026-69247
    "bokeh",
    "imageio",
    "numba",
    "pandas",
    "plotly",
    "shap",
    "scikit-learn",
    "seaborn",
    "cloudpickle",
    "s3fs>=2026.2.0",
    "aiohttp>=3.14.4",  # CVE-2026-111064, CVE-2026-111066, GHSA-2g87-pp6c-29x5
    "tornado>=6.5.8",  # GHSA-3x9g-8vmp-wqvf, GHSA-mgf9-4vpg-hj56, CVE-2026-82397 (transitive)
    "cryptography>=50.0.0",  # CVE-2026-69247, CVE-2026-69249 (transitive)
    "sqlparse>=0.6.0",  # CVE-2026-54284, CVE-2026-59893, CVE-2026-71491 (transitive via mlflow-skinny)
    "pyasn1>=0.6.4",  # CVE-2026-59884 / CVE-2026-59885 / CVE-2026-59886 (transitive)
    "brotli>=1.2.1",  # CVE-2026-111497, GHSA-9v8h-qqgm-4m35 (transitive via geventhttpclient)
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

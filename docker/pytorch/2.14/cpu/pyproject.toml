[project]
name = "pytorch-dlc-cpu"
version = "2.14.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "torchaudio==2.11.0",
    "deepspeed==0.19.6",
    "fastai",
    "boto3",
    "botocore",
    "pyyaml",
    "requests",
    "packaging",
    "urllib3>=2.8.0",  # CVE-2026-97687, CVE-2026-97689
    "python-multipart>=0.0.30",
    "starlette>=1.3.1",
    "GitPython>=3.2.1",  # CVE-2026-114145, GHSA-23mf-xhv8-69c2, GHSA-f9j4-qggq-h239, GHSA-m64x-33q8-m5h7, GHSA-w8jc-g24h-crhw
    "Mako>=1.3.12",
    "mpi4py",
    "scipy",
    "scikit-learn",
    "opencv-python",
    "msgpack>=1.2.3",  # CVE GHSA-6v7p-g79w-8964, CVE-2026-114613 (transitive via deepspeed)
    "soupsieve>=2.8.4",  # CVE GHSA-2wc2-fm75-p42x, GHSA-836r-79rf-4m37 (transitive via beautifulsoup4 -> python-fasthtml -> fastai)
    "click>=8.3.3",  # CVE-2026-7246 (transitive)
    "pillow>=13.0.0",  # CVE-2026-55379, CVE-2026-96639, CVE-2026-112390-112406, CVE-2026-112891-112901 (transitive via torchvision / fastai)
    "certifi>=2026.10.18",  # GHSA-6q48-6c7w-9gw2 (transitive via requests / httpx)
    "filelock>=4.2.1",  # CVE-2026-112940 (transitive via torch)
    "oauthlib>=4.0.0",  # GHSA-3jp2-3mrg-2vxc (transitive via fastai -> fastprogress -> python-fasthtml)
]

[project.optional-dependencies]
sagemaker = [
    "smclarify",
    "sagemaker>=3.4.0",
    "sagemaker-pytorch-training",
    "sagemaker-training",
    "mlflow>=3.17.2",  # relaxes cryptography cap to <51, unblocking CVE-2026-69247; CVE-2026-116690, CVE-2026-116692, CVE-2026-53995
    "bokeh",
    "imageio",
    "numba",
    "pandas",
    "plotly",
    "shap",
    "scikit-learn",
    "seaborn",
    "cloudpickle",
    "s3fs>=2026.2.0",
    "aiohttp>=3.14.4",  # CVE-2026-111064, CVE-2026-111066, GHSA-2g87-pp6c-29x5
    "Brotli>=1.2.1",  # CVE-2026-111497, GHSA-9v8h-qqgm-4m35 (transitive via tritonclient -> geventhttpclient)
    "tornado>=6.5.8",  # GHSA-3x9g-8vmp-wqvf, GHSA-mgf9-4vpg-hj56, CVE-2026-82397 (transitive)
    "cryptography>=50.0.0",  # CVE-2026-69247, CVE-2026-69249 (transitive)
    "sqlparse>=0.6.0",  # CVE-2026-54284, CVE-2026-59893, CVE-2026-71491 (transitive via mlflow-skinny)
    "pyasn1>=0.6.4",  # CVE-2026-59884 / CVE-2026-59885 / CVE-2026-59886 (transitive)
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

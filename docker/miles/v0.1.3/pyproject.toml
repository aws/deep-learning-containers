# Python dependency lock input for the Miles v0.1.3 AL2023 images.
#
# `uv sync` installs every registry and release-wheel distribution from uv.lock,
# hash-checked. The Dockerfile then builds the framework sources (SGLang,
# Megatron-LM, Miles, torchtitan and the pinned git packages) on top with
# --no-deps, so their dependency closure has to be resolved here.
#
# constraint-dependencies is the `pip freeze --all` of the official image
# radixark/miles:v0.1.3 (amd64 sha256:539a2b07a94fd71b7de8c824d30ce24fbc3177f8190e6a67a6c45127889a2437)
# with local file/VCS entries removed, so every shared package keeps the
# upstream version. The exceptions are security fixes that v0.1.3 does not
# have: certifi 2026.10.19, pillow 13.0.0 and virtualenv 21.14.9.
#
# The Miles release wheels install from /opt/miles-wheels, where the Dockerfile
# copies what scripts/ci/build/miles/pre_build.sh stages into ./wheels. Regenerate
# uv.lock after editing this file, with the wheels staged and mounted at that path:
#   bash scripts/ci/build/miles/pre_build.sh --config-file .github/config/image/miles/ec2-amzn2023.yml
#   docker run --rm -v "$PWD/docker/miles/v0.1.3":/w -w /w \
#     -v "$PWD/docker/miles/v0.1.3/wheels":/opt/miles-wheels:ro \
#     -e SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SGLANG=0.5.23.dev51+g3a93821 -e SGLANG_BUILD_RUST_EXTS=none \
#     ghcr.io/astral-sh/uv:0.13.4-python3.12-trixie uv lock

[project]
name = "miles-dlc"
version = "0.1.3"
requires-python = "==3.12.*"
dependencies = [
    # Framework sources built by the Dockerfile. They are locked for their
    # dependencies only and skipped by `uv sync --no-install-package`.
    # The runai extra adds the S3/GCS/Azure model-streamer backends the SGLang
    # base image ships.
    "sglang[all,runai]",
    "miles",
    # PyPI only publishes glibc 2.39 wheels; built from the v0.6.0 tag instead.
    "nvidia-resiliency-ext",
    # Rebuilt from the router commit Miles pins (the release wheel needs glibc 2.39).
    "sglang-router==0.3.2",
    # Built from the commit Miles pins; locked for SGLang's requirement on it.
    "torch-memory-saver==0.0.9.post1",
    # Megatron-LM (installed editable) and Emerging-Optimizers dependencies.
    "absl-py",
    "numpy",
    "packaging",
    "torch",
    # torchtitan is installed with --no-deps; upstream adds these explicitly.
    "spmd-types",
    "torchdata",
    "tyro",
    "nvidia-modelopt",
    # Miles release wheels (radixark/miles-wheels cu130-torch214-x86_64), staged locally.
    "apex",
    "causal-conv1d",
    "fast-hadamard-transform",
    "flash-attn",
    "flash-attn-3",
    "flash-mla",
    "mamba-ssm",
    "transformer-engine",
    "transformer-engine-cu13",
    "transformer-engine-torch",
    # TransformerEngine runtime deps; the TE wheels themselves carry no deps.
    "einops",
    "nvdlfw-inspect",
    "onnx",
    "onnxscript",
    "pydantic",
    # Runtime deps of Megatron-Bridge and multi-storage-client, which are
    # installed without their declared dependencies.
    "peft",
    "prettytable",
    # Kernel and storage packages the Miles recipe installs directly.
    "apache-tvm-ffi",
    "flash-linear-attention",
    "megatron-energon",
    "mooncake-transfer-engine-cuda13",
    "multi-storage-client",
    "nvidia-cudnn-cu13",
    "nvidia-cudnn-frontend",
    "tile-kernels",
    "tilelang",
    # MSCCL++ (built from source by the Dockerfile) runtime deps, from its cuda13 extra.
    "cupy-cuda13x",
    "sortedcontainers",
    # Packages the SGLang base image provides that the Miles runtime uses.
    "boto3",
    "botocore",
    "nccl4py",
    "nixl",
    "nixl-cu13",
    "nvidia-cutlass-dsl-libs-cu12",
    # SGLang's redis:// model connector.
    "redis",
    "s3transfer",
    # Packages served from the PyTorch, SGLang and FlashInfer indexes.
    "flashinfer-cubin",
    "flashinfer-jit-cache",
    # Per-architecture parts of flashinfer-jit-cache; listed so the FlashInfer index applies.
    "flashinfer-jit-cache-sm80",
    "flashinfer-jit-cache-sm89",
    "flashinfer-jit-cache-sm90a",
    "flashinfer-jit-cache-sm100a",
    "flashinfer-jit-cache-sm103a",
    "flashinfer-jit-cache-sm120f",
    "sglang-kernel",
    "torchaudio",
    "torchcodec",
    "torchvision",
    # Build tools for the --no-build-isolation source builds.
    "cmake==4.4.3",
    "ninja",
    "pip",
    "pybind11",
    "setuptools",
    "setuptools-rust==1.13.0",
    "setuptools-scm==10.3.4",
    "wheel",
    "wheel-stub==0.5.0",
    # Upstream now ships uv as a standalone binary (0.13.1) rather than a package. The
    # image keeps the package, at the uv version the build itself uses (UV_VERSION).
    "uv==0.13.4",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The official image's final state is not a consistent solve: upstream applies
# these versions after the solver. Overrides reproduce them.
override-dependencies = [
    # moviepy caps pillow<12.
    "pillow==13.0.0",
    # SGLang pins tilelang==0.1.12.
    "tilelang==0.1.14",
]

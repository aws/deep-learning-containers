[project]
name = "dlc-ray-llm"
version = "2.58.0"
requires-python = "==3.13.*"
dependencies = [
    "ray[default,serve,llm]==2.58.0",
    # ray[llm] 2.58.0 hard-pins vllm[audio]==0.26.0; bump when Ray moves its pin.
    "vllm==0.26.0",
    "torch==2.13.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "transformers==5.16.1",
    # fastapi >=0.140 breaks Ray Serve's cloudpickle path for @serve.ingress.
    "fastapi==0.133.1",
    "boto3>=1.35.0",
    "awscli>=1.35.0",
    "pip>=25.0",
]

[tool.uv]
# nixl (via ray[llm]) hard-depends on both nixl-cu12 and nixl-cu13; the wheels
# overwrite each other's .so and cu12 wins on cu13 images. Drop cu12.
override-dependencies = [
    "nixl-cu12 ; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cu130"}]
torchvision = [{index = "pytorch-cu130"}]
torchaudio = [{index = "pytorch-cu130"}]

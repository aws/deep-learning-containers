[project]
name = "tensorflow-dlc"
version = "2.21.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow==2.21.0",
    "nvidia-cudnn-cu12==9.24.0.43",
    "nvidia-nccl-cu12==2.30.7",
    "mpi4py",
    "boto3",
    "botocore",
    "aiohttp>=3.14.3",  # CVE-2026-69244 (HIGH)
    "PyJWT>=2.13.0",  # CVE-2026-48526 (HIGH)
    "cryptography>=49.0.0",  # CVE-2026-69249 (HIGH); >=50 blocked by mlflow<50
    "starlette>=1.6.0",  # GHSA-82w8-qh3p-5jfq + GHSA-wqp7-x3pw-xc5r (HIGH)
    "tornado>=6.5.6",  # GHSA-3x9g-8vmp-wqvf + GHSA-mgf9-4vpg-hj56 (HIGH)
    "soupsieve>=2.8.4",  # GHSA-2wc2-fm75-p42x + GHSA-836r-79rf-4m37 (HIGH)
    "mistune>=3.3.0",  # CVE-2026-59922 + CVE-2026-49851 (HIGH)
    "GitPython>=3.1.59",  # GHSA-jm78 + GHSA-hmq2 + GHSA-wvpp + GHSA-9rj7 + GHSA-3f7w + GHSA-4gmw (HIGH)
    "pyasn1>=0.6.4",  # CVE-2026-59885 + CVE-2026-59886 (HIGH)
    "keras>=3.15.0",  # CVE-2026-12481 (CRITICAL) + CVE-2026-12484 (HIGH)
    "jupyterlab>=4.6.0",  # GHSA-pppj-hq3g-57pj + GHSA-gx64-gj6p-pc4c (HIGH)
    "sqlparse>=0.6.0",  # CVE-2026-71491 + CVE-2026-54284 + CVE-2026-59893 (HIGH)
    "numpy>=2.1,<2.5",
    "requests",
    "packaging",
    "pybind11",
    "scipy",
    "Pillow>=12.3.0",  # CVE-2026-55379 (HIGH)
    "python-dateutil",
    "awscli<2",
    "h5py",
    "absl-py",
    "werkzeug",
    "urllib3",
    "protobuf",
]

[project.optional-dependencies]
sagemaker = [
    "sagemaker-tensorflow-training",
    "sagemaker-training",
    "smclarify",
    "sagemaker>=3.4.0",
    "mlflow>=3.15.2",
    "tensorflow-io==0.37.*",
    "tensorflow-datasets",
    "opencv-python",
    "numba",
    "bokeh",
    "imageio",
    "plotly",
    "seaborn",
    "shap",
    "pandas",
    "scikit-learn",
    "cloudpickle",
    "sagemaker-experiments==0.1.45",
    "y-py",
    "sagemaker-studio-analytics-extension",
    "sparkmagic==0.22.0",
    "sagemaker-studio-sparkmagic-lib",
    "s3fs>=2026.2.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[project]
name = "tensorflow-dlc-cpu"
version = "2.21.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow_cpu==2.21.0",
    "mpi4py",
    "boto3",
    "botocore",
    "aiohttp>=3.14.4",  # CVE-2026-111064 + CVE-2026-111066 + GHSA-2g87-pp6c-29x5 (HIGH)
    "PyJWT>=2.15.0",  # CVE-2026-102268 (CRITICAL) + CVE-2026-102266/102267/102271/102272/102273/102274/102275 + CVE-2026-48526 (HIGH)
    "cryptography>=50.0.0",  # CVE-2026-69249 + CVE-2026-69247 (HIGH)
    "starlette>=1.3.1",  # GHSA-82w8-qh3p-5jfq + GHSA-wqp7-x3pw-xc5r (HIGH)
    "tornado>=6.6",  # GHSA-3x9g-8vmp-wqvf + GHSA-mgf9-4vpg-hj56 + CVE-2026-82397 (HIGH)
    "soupsieve>=2.8.4",  # GHSA-2wc2-fm75-p42x + GHSA-836r-79rf-4m37 (HIGH)
    "mistune>=3.3.0",  # CVE-2026-59922 + CVE-2026-49851 (HIGH)
    "GitPython>=3.2.1",  # CVE-2026-114145 + GHSA-23mf-xhv8-69c2 + GHSA-f9j4-qggq-h239 + GHSA-m64x-33q8-m5h7 + GHSA-w8jc-g24h-crhw (HIGH)
    "pyasn1>=0.6.4",  # CVE-2026-59885 + CVE-2026-59886 (HIGH)
    "keras>=3.15.0",  # CVE-2026-12481 (CRITICAL) + CVE-2026-12484 (HIGH)
    "jupyterlab>=4.6.4",  # GHSA-pppj-hq3g-57pj + GHSA-gx64-gj6p-pc4c + CVE-2026-102831 (HIGH)
    "notebook>=7.6.3",  # CVE-2026-102831 (HIGH)
    "fsspec>=2026.6.0",  # CVE-2026-104851 (HIGH)
    "sqlparse>=0.6.0",  # CVE-2026-71491 + CVE-2026-54284 + CVE-2026-59893 (HIGH)
    "anyio>=4.14.2",  # CVE-2026-63374 (CRITICAL)
    "jupyter-server>=2.21.0",  # CVE-2026-86049 (HIGH)
    "numpy>=2.1,<2.5",
    "requests",
    "packaging",
    "pybind11",
    "scipy",
    "Pillow>=13.0.0",  # CVE-2026-112393 + CVE-2026-112398 + CVE-2026-112403 + CVE-2026-112900 + CVE-2026-96639 (CRITICAL) + 24 HIGH pillow CVEs
    "python-dateutil",
    "awscli<2",
    "h5py",
    "absl-py",
    "werkzeug",
    "urllib3>=2.8.0",  # CVE-2026-97687 + CVE-2026-97689 (HIGH)
    "protobuf",
    "psutil",
    "brotli>=1.2.1",  # CVE-2026-111497 (CRITICAL) + GHSA-9v8h-qqgm-4m35 (CRITICAL)
    "certifi>=2026.10.18",  # GHSA-6q48-6c7w-9gw2 (CRITICAL)
    "filelock>=4.2.1",  # CVE-2026-112940 (HIGH)
    "nbconvert>=7.17.2",  # CVE-2026-114140 (HIGH)
]

[project.optional-dependencies]
sagemaker = [
    "sagemaker-tensorflow-training",
    "sagemaker-training",
    "smclarify",
    "sagemaker>=3.4.0",
    "mlflow>=3.17.2",  # CVE-2026-53995 (HIGH); also relaxes cryptography cap to <51, unblocking cryptography>=50 for CVE-2026-69247
    "torch",
    "tensorflow-io==0.37.*",
    "tensorflow-datasets",
    "opencv-python",
    "numba",
    "bokeh",
    "imageio",
    "plotly",
    "seaborn",
    "shap",
    "pandas",
    "scikit-learn",
    "cloudpickle",
    "sagemaker-experiments==0.1.45",
    "y-py",
    "sagemaker-studio-analytics-extension",
    "sparkmagic==0.22.0",
    "sagemaker-studio-sparkmagic-lib",
    "s3fs>=2026.2.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

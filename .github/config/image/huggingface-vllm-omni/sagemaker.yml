image:
  name: "huggingface-vllm-omni-sagemaker"
  description: "Hugging Face vLLM-Omni for SageMaker (layered on the AWS vLLM DLC, AL2023)"

metadata:
  framework: "huggingface-vllm-omni"
  framework_version: "0.26.0"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "general"
  contributor: "huggingface"
  prod_image: "huggingface-vllm-omni:0.26-gpu-py312-cu130-amzn2023"

build:
  dockerfile: "docker/huggingface/vllm_omni/Dockerfile"
  target: "huggingface-vllm-omni-sagemaker"
  # vllm:server-sagemaker-cuda-v2 as of 2026-08-03 — vllm-server 0.26.0, dlc 2.2.
  # Digest-pinned: the v2 SageMaker line publishes no immutable tag for this
  # release (v2.2 / v2.2.0 exist only as -soci artifacts), and the floating v2
  # tag advances across vLLM minors. The Dockerfile asserts the base's vLLM minor
  # matches vllm_omni_version, so a stale pin fails the build loudly.
  base_image: "public.ecr.aws/deep-learning-containers/vllm@sha256:fe9f03d1b5281606d707f666cbdaa8e3afd2725389103599851dabfe2cf56a83"
  python_version: "3.12"
  cuda_version: "13.0.2"
  vllm_omni_version: "0.26.0"
  s3tokenizer_version: "0.3.0"
  transformers_version: "5.10.2"
  huggingface_hub_version: "1.17.0"
  hf_xet_version: "1.5.0"
  dlc_major_version: "1"
  dlc_minor_version: "0"

release:
  release: true
  force_release: false
  public_registry: false
  private_registry: true
  enable_soci: false
  environment: "production"

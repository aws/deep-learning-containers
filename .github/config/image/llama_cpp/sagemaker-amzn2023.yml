image:
  name: "llama-cpp-sagemaker-amzn2023"
  description: "llama.cpp CPU-inference for SageMaker (AL2023, built from source)"

metadata:
  framework: "llama_cpp"
  framework_version: "1.0.0+b10433"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "x86"
  device_type: "cpu"
  job_type: "general"
  prod_image: "llama-cpp:server-sagemaker-cpu-v1"

build:
  dockerfile: "docker/llama_cpp/Dockerfile.cpu"
  target: "llama-cpp-sagemaker"
  python_version: "3.12"
  llama_cpp_ref: "9b05354ec6fb58b4e665e9a39ebc40285c015638"  # b10433
  dlc_major_version: "1"
  dlc_minor_version: "0"

release:
  release: true
  force_release: false
  public_registry: true
  private_registry: true
  enable_soci: true
  environment: "production"

image:
  name: "llama-cpp-sagemaker-gpu-amzn2023"
  description: "llama.cpp CUDA-inference for SageMaker (AL2023, built from source)"

metadata:
  framework: "llama_cpp"
  framework_version: "b10075+dlc1"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "general"
  prod_image: "llama-cpp:server-sagemaker-cuda-v1"

build:
  dockerfile: "docker/llama_cpp/Dockerfile.gpu.amzn2023"
  target: "llama-cpp-sagemaker"
  python_version: "3.12"
  cuda_version: "13.0.2"
  llama_cpp_ref: "b10075"
  dlc_major_version: "1"
  dlc_minor_version: "0"

release:
  release: true
  force_release: false
  public_registry: true
  private_registry: true
  enable_soci: true
  environment: "production"

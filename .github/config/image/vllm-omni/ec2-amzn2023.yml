image:
  name: "vllm-omni-ec2-amzn2023"
  description: "vLLM-Omni for EC2 instances (AL2023, omni-modality serving)"

metadata:
  framework: "vllm_omni"
  framework_version: "0.32.0"
  os_version: "amzn2023"
  customer_type: "ec2"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "general"
  prod_image: "vllm:omni-cuda-v1"

build:
  dockerfile: "docker/vllm_omni/Dockerfile.amzn2023"
  target: "vllm-omni-ec2-amzn2023"
  python_version: "3.12"
  cuda_version: "13.0.2"
  vllm_ref: "5df63a7203cdb9328d824a27b682e77c7b9928be"  # v0.32.0
  vllm_omni_version: "0.32.0"
  flashinfer_version: "0.7.0.post1"
  deepep_commit_hash: "874779c9ccd2294b56304bd6cc5f138f1f71d097"
  efa_version: "latest"
  torch_cuda_arch_list: "7.5;8.0;8.6;8.9;9.0;10.0;11.0;12.0"
  install_kv_connectors: "true"
  dlc_major_version: "1"
  dlc_minor_version: "9"
  use_sccache: "true"

release:
  release: true
  force_release: false
  public_registry: true
  private_registry: true
  enable_soci: true
  environment: "production"

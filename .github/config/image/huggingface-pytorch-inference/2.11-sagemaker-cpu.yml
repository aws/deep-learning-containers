image:
  name: "huggingface-pytorch-inference-sagemaker-cpu"
  description: "Hugging Face PyTorch inference for SageMaker on CPU (layered on the AWS PyTorch DLC)"

metadata:
  framework: "huggingface-pytorch-inference"
  framework_version: "2.11.0"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "x86"
  device_type: "cpu"
  job_type: "inference"
  contributor: "huggingface"
  prod_image: "huggingface-pytorch-inference:2.11-transformers5.16-amzn2023-sagemaker-v1"

build:
  dockerfile: "docker/huggingface/pytorch/inference/Dockerfile.cpu"
  target: "sagemaker"
  base_image: "public.ecr.aws/deep-learning-containers/pytorch:2.11.0-cpu-amzn2023-sagemaker"
  python_version: "3.12"
  transformers_version: "5.16.1"
  hf_serve_version: "0.1.4"
  dlc_major_version: "1"
  dlc_minor_version: "0"

release:
  release: true
  force_release: false
  public_registry: false
  private_registry: true
  enable_soci: false
  environment: "production"

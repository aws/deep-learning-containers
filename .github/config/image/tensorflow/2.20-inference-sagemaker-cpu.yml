image:
  name: "tensorflow-2.20-inference-sagemaker-cpu"
  description: "TensorFlow Serving 2.20 CPU inference for SageMaker"

metadata:
  framework: "tensorflow"
  framework_version: "2.20.0"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  arch_type: "x86"
  device_type: "cpu"
  job_type: "inference"
  prod_image: "tensorflow-inference:2.20-cpu-py312-amzn2023-sagemaker-v1"

build:
  dockerfile: "docker/tensorflow/inference/2.20/Dockerfile.cpu"
  target: "sagemaker"
  python_version: "3.12"
  tf_serving_version: "2.20.0"
  tfs_short_version: "2.20"
  nginx_version: "1.30.2"
  njs_version: "0.9.9"
  dlc_major_version: "1"

release:
  release: true
  force_release: false
  public_registry: true
  private_registry: true
  enable_soci: true
  environment: "production"

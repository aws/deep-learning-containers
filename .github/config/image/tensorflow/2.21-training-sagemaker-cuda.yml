image:
  name: "tensorflow-2.21-training-sagemaker-cuda"
  description: "TensorFlow 2.21 CUDA training for SageMaker"

metadata:
  framework: "tensorflow"
  framework_version: "2.21.0"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "training"
  prod_image: "tensorflow-training:2.21-gpu-py312-cu129-amzn2023-sagemaker-v1"

build:
  dockerfile: "docker/tensorflow/training/2.21/Dockerfile.cuda"
  target: "sagemaker"
  python_version: "3.12"
  cuda_version: "12.9.1"
  tf_version: "2.21.0"
  open_mpi_version: "4.1.8"
  efa_version: "latest"
  # Source-built TF wheel (native Blackwell sm_120 for G7/G7e): see
  # scripts/docker/tensorflow/training/build_tf_wheel.sh
  tf_commit: "a481b10260dfdf833a1b16007eead49c1d7febf3"  # tag v2.21.0
  bazel_version: "7.7.0"  # must match the TF tag's .bazelversion (checked by the build)
  bazel_sha256: "fe7e799cbc9140f986b063e06800a3d4c790525075c877d00a7112669824acbf"
  hermetic_cudnn_version: "9.16.0"
  cuda_compute_capabilities: "sm_60,sm_70,sm_80,sm_89,sm_90,sm_100,sm_120,compute_120"
  dlc_major_version: "1"

release:
  release: true
  force_release: false
  public_registry: true
  private_registry: true
  enable_soci: true
  environment: "production"

image:
  name: "lambda-vllm"
  description: "Lambda vLLM GPU image with CUDA and Python"

metadata:
  framework: "lambda"
  framework_version: "0.30.0"
  os_version: "amzn2023"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "general"
  container_type: "vllm-cuda"
  prod_image: "lambda:vllm-cuda"

build:
  dockerfile: "docker/lambda/Dockerfile"
  target: "vllm-py3"
  python_version: "3.13"
  cuda_version: "13.0.3"
  vllm_ref: "ced6857afa0ea7b2e3f0846a62e1394e90f15607"
  vllm_version: "0.30.0"
  flashinfer_version: "0.6.18.post1"
  torch_cuda_arch_list: "8.0 8.6 8.9 12.0"
  use_sccache: "true"
  dlc_major_version: "1"
  dlc_minor_version: "0"

release:
  release: true
  force_release: false
  public_registry: false
  private_registry: true
  enable_soci: false
  environment: "production"

image:
  name: "lambda-base"
  description: "Lambda base GPU image with CUDA and Python"

metadata:
  framework: "lambda"
  framework_version: "13.0.3"
  os_version: "amzn2023"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "general"
  container_type: "base-cuda"
  prod_image: "lambda:base-cuda"

build:
  dockerfile: "docker/lambda/Dockerfile"
  target: "base-py3"
  python_version: "3.13"
  cuda_version: "13.0.3"
  dlc_major_version: "1"
  dlc_minor_version: "0"

release:
  release: true
  force_release: false
  public_registry: false
  private_registry: true
  enable_soci: false
  environment: "production"

image:
  name: "tensorflow-2.20-inference-sagemaker-cuda"
  description: "TensorFlow Serving 2.20 CUDA inference for SageMaker"

metadata:
  framework: "tensorflow"
  framework_version: "2.20.0"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "inference"
  prod_image: "tensorflow-inference:2.20-gpu-py312-cu129-amzn2023-sagemaker-v1"

build:
  dockerfile: "docker/tensorflow/inference/2.20/Dockerfile.cuda"
  target: "sagemaker"
  python_version: "3.12"
  cuda_version: "12.9.1"
  tf_serving_version: "2.20.0"
  dlc_major_version: "1"

release:
  release: true
  force_release: false
  public_registry: true
  private_registry: true
  enable_soci: true
  environment: "production"

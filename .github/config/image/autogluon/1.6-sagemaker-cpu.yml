image:
  name: "autogluon-1.6-sagemaker-cpu"
  description: "AutoGluon 1.6 CPU training and inference for SageMaker"

metadata:
  framework: "autogluon"
  framework_version: "1.6.2"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "x86"
  device_type: "cpu"
  job_type: "general"
  prod_image: "autogluon:1.6-cpu-amzn2023"

build:
  dockerfile: "docker/autogluon/Dockerfile.cpu"
  target: "sagemaker"
  base_image: "public.ecr.aws/deep-learning-containers/pytorch:2.13-cpu-amzn2023-sagemaker"
  python_version: "3.12"
  dlc_major_version: "1"
  dlc_minor_version: "0"

release:
  # Gamma-testing the unified image before production.
  # Follow-up: publish the AutoGluon docs only after the production release succeeds.
  release: true
  force_release: false
  public_registry: false
  private_registry: true
  enable_soci: false
  environment: "gamma"

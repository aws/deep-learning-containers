image:
  name: "pytorch-2.15-sagemaker-cuda"
  description: "PyTorch 2.15 CUDA training for SageMaker"

metadata:
  framework: "pytorch_runtime"
  framework_version: "2.15.0"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "training"
  prod_image: "pytorch:2.15-cu134-amzn2023-sagemaker"

build:
  dockerfile: "docker/pytorch/Dockerfile.cuda"
  target: "sagemaker"
  python_version: "3.12"
  cuda_version: "13.4.3"
  torch_version: "2.15.0"
  torchvision_version: "0.29.2"
  torchaudio_version: "2.11.1"
  flash_attn_version: "2.8.3.post2"
  deepspeed_version: "0.20.0"
  transformer_engine_version: "2.21.0"
  nccl_version: "2.30.7-1"
  nccl_tests_version: "v2.21.1"
  efa_version: "latest"
  gdrcopy_version: "2.7"
  max_jobs: "8"
  dlc_major_version: "1"
  dlc_minor_version: "0"

release:
  release: true
  force_release: false
  public_registry: true
  private_registry: true
  enable_soci: true
  environment: "gamma"

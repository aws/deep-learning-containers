image:
  name: "vllm-sagemaker-amzn2023"
  description: "vLLM for SageMaker (AL2023, built from source)"

metadata:
  framework: "vllm_server"
  framework_version: "0.27.0"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "general"
  prod_image: "vllm:server-sagemaker-cuda-v2"

build:
  dockerfile: "docker/vllm/Dockerfile.amzn2023"
  target: "vllm-sagemaker-amzn2023"
  python_version: "3.12"
  cuda_version: "13.0.2"
  # First release carrying Kimi-K3.
  # Kept in lockstep with ec2-amzn2023.yml -- same Dockerfile.
  vllm_ref: "v0.27.0"
  # 10.3 == B300 (SM103). Part of the wheel cache key, so changing it forces a recompile.
  torch_cuda_arch_list: "7.0 7.5 8.0 8.9 9.0 10.0 10.3 12.0"
  flashinfer_version: "0.6.16.post3"
  deepep_commit_hash: "d4f41e4e93602a15e95f55f6ee8df8f1aaa0e4bb"
  dlc_major_version: "2"
  dlc_minor_version: "3"
  use_sccache: "true"

release:
  release: true
  force_release: false
  public_registry: true
  private_registry: true
  enable_soci: true
  environment: "production"

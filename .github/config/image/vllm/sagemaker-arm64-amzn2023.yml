image:
  name: "vllm-cpu-arm64-sagemaker-amzn2023"
  description: "vLLM CPU-inference for SageMaker (arm64/Graviton, AL2023, built from source)"

metadata:
  framework: "vllm_server"
  framework_version: "0.33.0"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "arm64"
  device_type: "cpu"
  job_type: "general"
  prod_image: "vllm-arm64:server-sagemaker-cpu-v1"

build:
  dockerfile: "docker/vllm/Dockerfile.cpu.arm64.amzn2023"
  target: "vllm-cpu-sagemaker-amzn2023"
  python_version: "3.12"
  vllm_ref: "4ba787ec9959e566d3b587a796dff07673324da5"  # v0.33.0
  # FEAT_BF16 is present on Graviton 3/4/5; build the aarch64 bf16 kernels from source.
  vllm_cpu_arm_bf16: "1"
  dlc_major_version: "1"
  dlc_minor_version: "1"

release:
  release: true
  force_release: false
  public_registry: true
  private_registry: true
  enable_soci: true
  environment: "production"

image:
  name: "huggingface-pytorch-training-neuronx-2.14-ec2"
  description: "Hugging Face PyTorch training layered on the AWS Torch NeuronX DLC"

metadata:
  framework: "huggingface-pytorch-training-neuronx"
  framework_version: "2.14.0"
  os_version: "ubuntu26.04"
  customer_type: "ec2"
  platform: "ec2"
  arch_type: "x86"
  device_type: "neuronx"
  job_type: "training"
  contributor: "huggingface"
  prod_image: "huggingface-pytorch-training-neuronx:2.14-transformers5.21-py314-sdk2.33.0-ubuntu26.04"

build:
  dockerfile: "docker/huggingface/pytorch/Dockerfile.neuronx"
  target: "install"
  base_image: "public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04"
  python_version: "3.14"
  transformers_version: "5.21.0"
  huggingface_hub_version: "1.33.0"
  hf_xet_version: "1.7.0"
  datasets_version: "5.1.0"
  accelerate_version: "1.15.0"
  peft_version: "0.21.2"
  trl_version: "1.16.0"
  diffusers_version: "0.41.0"
  evaluate_version: "0.4.6"
  dlc_major_version: "1"

release:
  release: false
  force_release: false
  public_registry: false
  private_registry: true
  enable_soci: false
  environment: "gamma"

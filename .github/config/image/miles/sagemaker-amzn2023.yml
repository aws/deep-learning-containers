image:
  name: "miles-sagemaker-amzn2023"
  description: "Miles 0.1.2 training for SageMaker (AL2023, CUDA 13.0, built from source)"

metadata:
  framework: "miles"
  framework_version: "0.1.2"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "training"
  prod_image: "miles:0.1.2-gpu-py312-cu130-amzn2023-sagemaker"

build:
  dockerfile: "docker/miles/Dockerfile.amzn2023"
  target: "sagemaker"
  # Kept in lockstep with ec2-amzn2023.yml -- same Dockerfile.
  # Python dependency pins live in docker/miles/v{miles_version}/{pyproject.toml,uv.lock},
  # installed via `uv sync --locked`. The commits below pin the source builds.
  python_version: "3.12"
  cuda_version: "13.0.3"
  uv_version: "0.12.21"
  miles_version: "0.1.2"
  torch_version: "2.13.0"
  sglang_version: "0.5.22.dev37+gb84bec5"
  efa_version: "latest"
  rust_version: "1.96.1"
  ffmpeg_version: "n8.1"
  gdrcopy_version: "2.5.1"
  nccl_tests_commit: "ae98985f5599617be94042f4aa3637d10014ce89"
  miles_commit: "a22fd824191c64ba7c5d6c531f125406e4ce9cc6"
  sglang_commit: "b84bec5761a6cdc8b1df86b9b89ead80a7a9bb02"
  megatron_commit: "fd15ee20a4f03b03680529baf4b8f7eeed64df1d"
  torchtitan_commit: "086bf6c166ec85c1298eb5596fa9bf95f6a2d840"
  sgl_router_commit: "374ff283397254d1a3c9577058d7089bcb91a7b1"
  flashqla_commit: "7c7dfe16416ad21b1d03258189fc8d3b8460ae06"
  mbridge_commit: "89eb10887887bc74853f89a4de258c0702932a1c"
  emerging_optimizers_commit: "b309e2f01cda75dc96a6dc1a2355a7b3b64b5e16"
  torch_memory_saver_commit: "b5588e83de86412a48689a6583a4b567e75f7acc"
  megatron_bridge_commit: "8cd3466d14d2337c8492827b3712482c2b3e4866"
  nvidia_resiliency_ext_commit: "6c5f2a13c7688d92a7ac7ee6e464721eb8b7345d"
  deepselect_commit: "0f03b68748b304863fdf0181a11458d04ae533a9"
  mscclpp_commit: "0a04f1af0c855cc2c8315a918f55a08107f745c8"
  mscclpp_version: "0.10.1"
  build_parallel: "16"
  torch_cuda_arch_list: "8.0;8.6;8.9;9.0;10.0;10.3"
  dlc_major_version: "0"
  dlc_minor_version: "1"

release:
  release: false
  force_release: false
  public_registry: false
  private_registry: false
  enable_soci: false
  environment: "gamma"

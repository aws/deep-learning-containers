image:
  name: "miles-ec2-amzn2023"
  description: "Miles 0.2.0 training for EC2 (AL2023, CUDA 13.0, built from source)"

metadata:
  framework: "miles"
  framework_version: "0.2.0"
  os_version: "amzn2023"
  customer_type: "ec2"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "training"
  prod_image: "miles:0.2.0-gpu-py312-cu130-amzn2023-ec2"

build:
  dockerfile: "docker/miles/Dockerfile.amzn2023"
  target: "ec2"
  # Python dependency pins live in docker/miles/v{miles_version}/{pyproject.toml,uv.lock},
  # installed via `uv sync --locked`. The commits below pin the source builds.
  python_version: "3.12"
  cuda_version: "13.0.3"
  uv_version: "0.13.6"
  miles_version: "0.2.0"
  torch_version: "2.14.1"
  sglang_version: "0.5.24.dev96+gfd01715"
  efa_version: "latest"
  rust_version: "1.96.1"
  ffmpeg_version: "n8.1"
  gdrcopy_version: "2.5.1"
  nvtop_version: "3.3.2"
  nccl_tests_commit: "ae98985f5599617be94042f4aa3637d10014ce89"
  miles_commit: "8e419cc739fb09b5f21085aeacc7f6fd951084e1"
  sglang_commit: "fd017154ad278e753c47ee376de611561e2455ea"
  megatron_commit: "809217f40d60ea671aa9958fcdbc754b33758e42"
  torchtitan_commit: "45e33cd413b64cb37a7840cfd3c9765d3c639ae1"
  sgl_router_commit: "236ff1163482b9db6c53bbdfd907c9e0413eb888"
  flashqla_commit: "7c7dfe16416ad21b1d03258189fc8d3b8460ae06"
  mbridge_commit: "89eb10887887bc74853f89a4de258c0702932a1c"
  emerging_optimizers_commit: "b309e2f01cda75dc96a6dc1a2355a7b3b64b5e16"
  torch_memory_saver_commit: "118b09b3bc7b0cf386745db1eac2601d4aa7e681"
  megatron_bridge_commit: "a0c6d6e09b0bd4d208c2d936608319d5ab456d87"
  nvidia_resiliency_ext_commit: "6c5f2a13c7688d92a7ac7ee6e464721eb8b7345d"
  deepselect_commit: "0f03b68748b304863fdf0181a11458d04ae533a9"
  mscclpp_commit: "0a04f1af0c855cc2c8315a918f55a08107f745c8"
  mscclpp_version: "0.10.1"
  # Release that scripts/ci/build/miles/pre_build.sh mirrors the locked wheels from.
  miles_wheels_repo: "radixark/miles-wheels"
  miles_wheels_tag: "cu130-torch214-x86_64"
  # Kubernetes clients for Miles' Helm launcher and workbench. Newer patch releases than
  # upstream's install-kube-tools.sh (v1.36.3 / v4.2.3) for their Go CVE fixes.
  kubectl_version: "v1.36.6"
  kubectl_sha256: "29818b6729dc9262b692307470d0558d027725e738be5dd47c760261868a2634"
  helm_version: "v4.3.2"
  helm_sha256: "d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983"
  build_parallel: "16"
  torch_cuda_arch_list: "8.0;8.6;8.9;9.0;10.0;10.3"
  dlc_major_version: "0"
  dlc_minor_version: "1"

release:
  release: false
  force_release: false
  public_registry: false
  private_registry: false
  enable_soci: false
  environment: "gamma"

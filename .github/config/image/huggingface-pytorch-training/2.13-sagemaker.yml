image:
  name: "huggingface-pytorch-training-2.13-sagemaker"
  description: "Hugging Face PyTorch training for SageMaker (layered on the AWS PyTorch training DLC)"

metadata:
  framework: "huggingface-pytorch-training"
  framework_version: "2.13.0"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "training"
  contributor: "huggingface"
  prod_image: "huggingface-pytorch-training:2.13-transformers5.17-cu133-amzn2023-sagemaker"

build:
  dockerfile: "docker/huggingface/pytorch/Dockerfile"
  target: "sagemaker"
  base_image: "public.ecr.aws/deep-learning-containers/pytorch:2.13.0-cu133-amzn2023-sagemaker"
  python_version: "3.12"
  cuda_version: "13.3.0"
  # vllm 0.31.0 caps transformers <5.18.0; bump both together.
  transformers_version: "5.17.0"
  # diffusers 0.41.0 caps huggingface-hub <2.0.
  huggingface_hub_version: "1.33.0"
  hf_xet_version: "1.7.0"
  trl_version: "1.15.0"
  diffusers_version: "0.41.0"
  hf_transfer_version: "0.1.9"
  datasets_version: "5.1.0"
  # fsspec + s3fs (same version); >=2026.6.0 fixes CVE-2026-104851.
  fsspec_version: "2026.7.0"
  accelerate_version: "1.15.0"
  peft_version: "0.21.2"
  evaluate_version: "0.4.6"
  math_verify_version: "0.9.0"
  # vllm pins torch exactly: 0.27.0-0.31.0 require torch==2.13.0 (this base).
  vllm_version: "0.31.0"
  dlc_major_version: "1"
  dlc_minor_version: "0"

release:
  # Gamma-testing the release before production.
  # Flip environment to "production" after gamma validates.
  release: true
  force_release: false
  public_registry: false
  private_registry: true
  enable_soci: false
  environment: "gamma"

image:
  name: "sglang-sagemaker-amzn2023"
  description: "SGLang for SageMaker (AL2023, built from source)"

metadata:
  framework: "sglang_server"
  framework_version: "0.5.23+dlc1"
  os_version: "amzn2023"
  customer_type: "sagemaker"
  platform: "sagemaker"
  arch_type: "x86"
  device_type: "gpu"
  job_type: "general"
  prod_image: "sglang:server-sagemaker-cuda-v1"

build:
  dockerfile: "docker/sglang/Dockerfile.amzn2023"
  target: "sglang-sagemaker"
  python_version: "3.12"
  cuda_version: "13.0.3"
  sglang_ref: "297e54fd105e974cdf401e5b4d20253a22c16f90"
  sglang_kernel_version: "0.4.10"
  flashinfer_version: "0.7.2"
  deepep_commit: "874779c9ccd2294b56304bd6cc5f138f1f71d097"
  mooncake_version: "0.3.13.post1"
  torch_version: "2.14.1"
  nccl_version: "2.31.2"
  cudnn_version: "9.24.0.43"
  efa_version: "latest"
  rust_version: "1.96.1"
  gdrcopy_version: "2.5.2"
  torch_cuda_arch_list: "9.0;10.0;10.3"
  dlc_major_version: "1"
  dlc_minor_version: "5"

release:
  release: true
  force_release: false
  public_registry: true
  private_registry: true
  enable_soci: true
  environment: "production"

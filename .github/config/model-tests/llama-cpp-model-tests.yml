# llama.cpp model smoke tests: serve Ornith-1.0-9B (Q4_K_M) GGUF, assert /health + a chat completion.
# Gated to arch+device via required_image_pattern. GPU entries run on x86-g6xl-runner (1x L4) with
# docker_gpus: all; CPU on x86-build-runner. arm64 model tests deferred until an arm64 test fleet exists.

s3_prefix: "s3://dlc-cicd-models/llm-models"

smoke-test:
  codebuild-fleet:
    # x86 CPU: same GGUF served CPU-only (no --n-gpu-layers).
    - name: "ornith-1.0-9b-q4_k_m"
      s3_model: "ornith-1.0-9b-q4_k_m.gguf.tar.gz"
      fleet: "x86-build-runner"
      extra_args: "--ctx-size 4096"
      required_image_pattern:
        device_type: cpu
        arch_type: x86

    # x86 GPU: same GGUF offloaded to the L4 (--n-gpu-layers 999); matches sglang/vllm GPU tests.
    - name: "ornith-1.0-9b-q4_k_m"
      s3_model: "ornith-1.0-9b-q4_k_m.gguf.tar.gz"
      fleet: "x86-g6xl-runner"
      docker_gpus: "all"
      extra_args: "--ctx-size 4096 --n-gpu-layers 999"
      required_image_pattern:
        device_type: gpu
        arch_type: x86

# llama.cpp Model Test Configuration
#
# smoke-test: model serving + inference validation. Each entry serves a small
# quantized GGUF and asserts /health + a chat completion.
#
# Entries are gated to an arch+device via required_image_pattern:
#   - x86 CPU images → codebuild-fleet (x86-build-runner), no GPU.
#   - x86 GPU images → runner-scale-sets on a single-GPU runner.
# arm64 CPU model tests are deferred until an arm64 CodeBuild fleet exists
# (same infra follow-up that gates the arm64 build).
#
# codebuild-fleet runners (CPU):
#   x86-build-runner = m6a.8xlarge (32 vCPU / 128 GiB)
# runner-scale-sets (GPU):
#   x86-g6xl-runner = 1x L4 (24 GiB)

s3_prefix: "s3://dlc-cicd-models/llm-models"

smoke-test:
  codebuild-fleet:
    - name: "qwen2.5-0.5b-q4_0"
      s3_model: "qwen2.5-0.5b-instruct-q4_0.gguf.tar.gz"
      fleet: "x86-build-runner"
      extra_args: "--ctx-size 4096"
      required_image_pattern:
        device_type: cpu
        arch_type: x86

  runner-scale-sets:
    # x86 GPU (CUDA) smoke test: offload the whole model to the GPU
    # (--n-gpu-layers 999) to exercise the CUDA backend.
    - name: "ornith-1.0-9b-q4_k_m"
      s3_model: "ornith-1.0-9b-q4_k_m.gguf.tar.gz"
      runner_label: "x86-g6xl-runner"
      extra_args: "--ctx-size 4096 --n-gpu-layers 999"
      required_image_pattern:
        device_type: gpu
        arch_type: x86

name: 'Check test pass'
description: >
  Decide whether a test suite can be skipped for a given image build.
  Outputs `skip=true|false` plus two content hashes.

inputs:
  image-uri:
    description: 'Image build to test (prefer digest-pinned ref).'
    required: true
  suite:
    description: 'Name of test suite (key in .github/config/test-suites.yml).'
    required: true
  platform:
    description: 'Platform manifest to hash.'
    required: false
    default: 'linux/amd64'
  aws-region:
    description: 'Region for ECR registry login used to read the image config.'
    required: true
  aws-account-id:
    description: 'Account ID of the ECR registry holding the image (for docker login).'
    required: true
  ci-images-table-account-id:
    description: 'Account ID hosting the dlc-ci-images DynamoDB table.'
    required: true

outputs:
  skip:
    description: 'true if the suite may be skipped, false otherwise.'
    value: ${{ steps.decide.outputs.skip }}
  image-content-hash:
    description: 'Computed hash of the image build layer digests.'
    value: ${{ steps.decide.outputs.image-content-hash }}
  suite-code-hash:
    description: 'Computed hash of the test suite file content.'
    value: ${{ steps.decide.outputs.suite-code-hash }}

runs:
  using: composite
  steps:
    - name: Setup dependencies
      shell: bash
      run: pip install --quiet boto3 pyyaml

    - name: ECR login
      uses: ./.github/actions/ecr-authenticate
      with:
        aws-account-id: ${{ inputs.aws-account-id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Decide skip
      id: decide
      shell: bash
      env:
        IMAGE_URI: ${{ inputs.image-uri }}
        SUITE: ${{ inputs.suite }}
        PLATFORM: ${{ inputs.platform }}
        CI_IMAGES_TABLE_ACCOUNT_ID: ${{ inputs.ci-images-table-account-id }}
      run: bash "${{ github.action_path }}/decide_skip.sh"

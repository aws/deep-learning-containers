name: Reusable Miles Multi-Node Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""
      instance-type:
        description: "EFA instance type with a capacity reservation for two instances"
        required: false
        type: string
        default: "p4d.24xlarge"

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      image-exists: ${{ steps.check.outputs.exists }}
      customer-type: ${{ steps.config.outputs.customer-type }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Read customer type
        id: config
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
        run: echo "customer-type=$(yq '.metadata.customer_type' "${CONFIG_FILE}")" >> "${GITHUB_OUTPUT}"

  # The runner launches two EFA instances and drives them over SSH; see
  # test/test_utils/efa_helpers.py. The GRPO run downloads its model and data from Hugging
  # Face, as upstream CI does. Only the EC2 image runs it: the SageMaker image has the
  # same training stack.
  multi-node-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' && needs.preflight.outputs.customer-type == 'ec2' }}
    needs: [preflight]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Setup test dependencies
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt

      - name: Run multi-node tests
        env:
          TEST_IMAGE_URI: ${{ needs.preflight.outputs.image-uri }}
          MULTI_NODE_INSTANCE_TYPE: ${{ inputs.instance-type }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          HF_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          source .venv/bin/activate
          PYTHONPATH="$(pwd)/test:${PYTHONPATH:-}" pytest -v --no-header \
            test/miles/multi_node/test_multi_node.py

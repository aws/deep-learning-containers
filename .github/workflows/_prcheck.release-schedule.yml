name: Release Schedule Validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/release-schedule.yml"
      - ".github/workflows/*.autorelease-*.yml"
      - "scripts/ci/check_release_schedule.py"

permissions:
  contents: read

jobs:
  validate-schedule:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: Setup python
        run: |
          uv venv --python 3.12
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: uv pip install pyyaml

      - name: Validate release schedule
        run: python3 scripts/ci/check_release_schedule.py

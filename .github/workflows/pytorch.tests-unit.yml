name: Reusable PyTorch Unit Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

  unit-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: ECR login
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      - name: Run unit tests
        run: |
          CONTAINER_ID=$(docker run -d --rm --entrypoint /bin/bash \
            -v $(pwd):/workdir --workdir /workdir \
            ${{ needs.preflight.outputs.image-uri }} -c 'sleep infinity')
          echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV
          docker exec ${CONTAINER_ID} pip install -r /workdir/test/requirements.txt -q
          docker exec -e PYTHONPATH=/workdir/test ${CONTAINER_ID} \
            pytest /workdir/test/pytorch/unit/ -v
          docker kill ${CONTAINER_ID}

      # Reached only if the tests above passed — record a PASS row so a later
      # run on the same image content + test code can skip this suite.
      - name: Compute test-skip hashes
        id: hashes
        env:
          IMAGE_URI: ${{ needs.preflight.outputs.image-uri }}
        run: |
          uv venv --python 3.12 --clear
          source .venv/bin/activate
          uv pip install pyyaml
          SCRIPTS="$(git rev-parse --show-toplevel)/scripts/ci/image_test_skip"
          {
            echo "image-content-hash=$(python3 "$SCRIPTS/hash_image_content.py" --image-uri "$IMAGE_URI")"
            echo "suite-code-hash=$(python3 "$SCRIPTS/hash_suite_code.py" --suite pytorch/unit)"
            echo "ci-image-tag=${IMAGE_URI##*:}"
          } >> "$GITHUB_OUTPUT"

      - name: Record test pass
        uses: ./.github/actions/record-test-pass
        with:
          suite: pytorch/unit
          image-content-hash: ${{ steps.hashes.outputs.image-content-hash }}
          suite-code-hash: ${{ steps.hashes.outputs.suite-code-hash }}
          ci-image-tag: ${{ steps.hashes.outputs.ci-image-tag }}
          ci-images-table-account-id: ${{ vars.CI_IMAGES_TABLE_ACCOUNT_ID }}

name: "PR - TensorFlow 2.20 Inference CPU"

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/config/image/tensorflow/2.20-inference-*-cpu.yml"
      - ".github/workflows/tensorflow.pipeline-inference.yml"
      - ".github/workflows/tensorflow.pr-2.20-inference-cpu.yml"
      - "docker/tensorflow/inference/2.20/Dockerfile.cpu"
      - "docker/tensorflow/inference/2.20/cpu/**"
      - "scripts/docker/common/**"
      - "scripts/docker/tensorflow/**"
      - "scripts/docker/telemetry/**"
      - "test/tensorflow/integration/inference/**"
      - "test/sanity/**"
      - "test/security/data/ecr_scan_allowlist/tensorflow/**"
      - "test/telemetry/**"
      - "!docs/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - uses: ./.github/actions/pr-permission-gate

  check-changes:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    outputs:
      build-change: ${{ steps.changes.outputs.build-change }}
      sagemaker-test-change: ${{ steps.changes.outputs.sagemaker-test-change }}
      sanity-test-change: ${{ steps.changes.outputs.sanity-test-change }}
      telemetry-test-change: ${{ steps.changes.outputs.telemetry-test-change }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            build-change:
              - ".github/config/image/tensorflow/2.20-inference-*-cpu.yml"
              - "docker/tensorflow/inference/2.20/Dockerfile.cpu"
              - "docker/tensorflow/inference/2.20/cpu/**"
              - "scripts/docker/common/**"
              - "scripts/docker/tensorflow/**"
              - "test/security/data/ecr_scan_allowlist/tensorflow/**"
              # B-2 fix: integration test files must also force a rebuild.
              # Without this, a test-only PR skips the build job, falls
              # back to a prod-account ECR tag that does not exist for
              # this new family, check-image-exists returns false,
              # sagemaker-test is skipped, and the parent job reports
              # green — merging a PR that breaks every endpoint test.
              - "test/tensorflow/integration/inference/**"
            sagemaker-test-change:
              - "test/tensorflow/integration/inference/**"
            sanity-test-change:
              - "test/sanity/**"
            telemetry-test-change:
              - "scripts/docker/telemetry/**"
              - "test/telemetry/**"

  discover:
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.discover.outputs.configs }}
    steps:
      - uses: actions/checkout@v6
      - id: discover
        uses: ./.github/actions/discover-configs
        with:
          pattern: ".github/config/image/tensorflow/2.20-inference-*-cpu.yml"

  pipeline:
    needs: [check-changes, discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.configs) }}
    uses: ./.github/workflows/tensorflow.pipeline-inference.yml
    with:
      config-file: ${{ matrix.config_file }}
      tag-suffix: pr-${{ github.event.pull_request.number }}
      build: ${{ needs.check-changes.outputs.build-change == 'true' }}
      run-sanity-test: ${{ needs.check-changes.outputs.build-change == 'true' || needs.check-changes.outputs.sanity-test-change == 'true' }}
      run-security-test: ${{ needs.check-changes.outputs.build-change == 'true' }}
      run-telemetry-test: ${{ needs.check-changes.outputs.build-change == 'true' || needs.check-changes.outputs.telemetry-test-change == 'true' }}
      run-sagemaker-test: ${{ needs.check-changes.outputs.build-change == 'true' || needs.check-changes.outputs.sagemaker-test-change == 'true' }}
      release: false
    secrets: inherit

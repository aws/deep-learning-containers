name: "TMP - release-runner gamma scale test"

# Temporary, remove before merge. Publishes three small llama.cpp CI images to
# gamma at the same time (publish-only) so step 1 runs three jobs on the
# release-runner fleet, one more than its base capacity of 2, forcing a scale-out.

on:
  push:
    branches: [weiyadan/release-runner-step1]

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    outputs:
      ec2: ${{ steps.ec2.outputs.release-spec }}
      sagemaker: ${{ steps.sagemaker.outputs.release-spec }}
      ec2-arm64: ${{ steps.ec2-arm64.outputs.release-spec }}
    steps:
      - uses: actions/checkout@v6
      - id: ec2
        uses: ./.github/actions/generate-release-spec
        with:
          config-file: .github/config/image/llama_cpp/ec2-amzn2023.yml
      - id: sagemaker
        uses: ./.github/actions/generate-release-spec
        with:
          config-file: .github/config/image/llama_cpp/sagemaker-amzn2023.yml
      - id: ec2-arm64
        uses: ./.github/actions/generate-release-spec
        with:
          config-file: .github/config/image/llama_cpp/ec2-arm64-amzn2023.yml

  release-ec2:
    needs: [specs]
    uses: ./.github/workflows/_reusable.release-image.yml
    with:
      source-image-uri: ${{ vars.CI_AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/ci:llama-cpp-ec2-amzn2023-1.0.0.v0.4.1-cpu-py312-37032497783
      release-spec: ${{ needs.specs.outputs.ec2 }}
      environment: gamma
      aws-region: ${{ vars.AWS_REGION }}
      publish-only: true
    secrets: inherit

  release-sagemaker:
    needs: [specs]
    uses: ./.github/workflows/_reusable.release-image.yml
    with:
      source-image-uri: ${{ vars.CI_AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/ci:llama-cpp-sagemaker-amzn2023-1.0.0.v0.4.1-cpu-py312-37041989850
      release-spec: ${{ needs.specs.outputs.sagemaker }}
      environment: gamma
      aws-region: ${{ vars.AWS_REGION }}
      publish-only: true
    secrets: inherit

  release-ec2-arm64:
    needs: [specs]
    uses: ./.github/workflows/_reusable.release-image.yml
    with:
      source-image-uri: ${{ vars.CI_AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/ci:llama-cpp-ec2-arm64-amzn2023-1.0.0.v0.4.1-cpu-py312-37038411076
      release-spec: ${{ needs.specs.outputs.ec2-arm64 }}
      environment: gamma
      aws-region: ${{ vars.AWS_REGION }}
      publish-only: true
    secrets: inherit

name: Reusable TensorFlow SageMaker Inference Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""
      device-type:
        description: "Device type from config metadata (cpu|gpu). Selects the SM instance type for endpoint deploys. Required to fail closed on wiring bugs."
        required: true
        type: string
      image-content-hash:
        description: "Image hash computed from hash_image_content.py for caching a test pass."
        required: false
        type: string
        default: ""
      suite-code-hash:
        description: "Test code hash computed from hash_suite_code.py for caching a test pass."
        required: false
        type: string
        default: ""
      non-blocking:
        description: "Report test failures without failing the job. Failed runs are not recorded as a test pass."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
      blackwell: ${{ steps.blackwell.outputs.blackwell }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      # Images built with native Blackwell code (sm_120 in the config's GPU
      # target list) also run the Blackwell endpoint job below.
      - name: Check for Blackwell build
        id: blackwell
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          if grep -Eq '^[[:space:]]*cuda_compute_capabilities:.*sm_120' "$CONFIG_FILE"; then
            echo "blackwell=true" >> "$GITHUB_OUTPUT"
          else
            echo "blackwell=false" >> "$GITHUB_OUTPUT"
          fi

  sagemaker-test:
    timeout-minutes: 180
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    outputs:
      tests-outcome: ${{ steps.tests.outcome }}
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: ECR login
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt -r test/tensorflow/integration/inference/requirements.txt

      - name: Run SageMaker inference tests
        id: tests
        # Step-level timeout so a hung endpoint deploy is a step failure that
        # non-blocking can absorb, instead of a job timeout that cannot be.
        timeout-minutes: 170
        continue-on-error: ${{ inputs.non-blocking }}
        env:
          PYTHONPATH: ${{ github.workspace }}/test
          SM_DEVICE_TYPE: ${{ inputs.device-type }}
          # GPU endpoints lead with ml.g6.xlarge, so they use the CI ML
          # Reservation for it when configured (test/test_utils/instance_capacity.py).
          ML_RESERVATION_ARN_G6_XLARGE: >-
            ${{ vars.ML_RESERVATION_NAME_G6_XLARGE && format('arn:aws:sagemaker:{0}:{1}:ml-reservation/{2}',
            vars.AWS_REGION, vars.CI_AWS_ACCOUNT_ID, vars.ML_RESERVATION_NAME_G6_XLARGE) || '' }}
        run: |
          source .venv/bin/activate
          python3 -m pytest -v --tb=short -rA -n 4 --dist loadfile \
            --image-uri ${{ needs.preflight.outputs.image-uri }} \
            --region ${{ vars.AWS_REGION }} \
            test/tensorflow/integration/inference/

      - name: Report non-blocking failure
        if: ${{ steps.tests.outcome == 'failure' }}
        run: echo "::warning::SageMaker inference tests failed (non-blocking for this variant)."

  # Blackwell (sm_120) endpoint tests on the CI G7 ML Reservation. GPU endpoints
  # are pinned to ml.g7.2xlarge with no fallback (a fallback to another GPU
  # family would pass without running the Blackwell code), and run one at a
  # time because the reservation holds one instance. Runs for images built with
  # sm_120, once the reservation is configured (ML_RESERVATION_NAME_G7_2XLARGE).
  sagemaker-test-blackwell:
    timeout-minutes: 180
    if: >-
      ${{ needs.preflight.outputs.image-exists == 'true' &&
          needs.preflight.outputs.blackwell == 'true' &&
          inputs.device-type == 'gpu' &&
          vars.ML_RESERVATION_NAME_G7_2XLARGE != '' }}
    needs: [preflight]
    outputs:
      tests-outcome: ${{ steps.tests.outcome }}
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: ECR login
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt -r test/tensorflow/integration/inference/requirements.txt

      - name: Run SageMaker inference tests on Blackwell (ml.g7.2xlarge)
        id: tests
        timeout-minutes: 170
        continue-on-error: ${{ inputs.non-blocking }}
        env:
          PYTHONPATH: ${{ github.workspace }}/test
          SM_DEVICE_TYPE: ${{ inputs.device-type }}
          SM_GPU_INSTANCE_TYPE: ml.g7.2xlarge
          ML_RESERVATION_ARN_G7_2XLARGE: >-
            ${{ format('arn:aws:sagemaker:{0}:{1}:ml-reservation/{2}',
            vars.AWS_REGION, vars.CI_AWS_ACCOUNT_ID, vars.ML_RESERVATION_NAME_G7_2XLARGE) }}
        run: |
          source .venv/bin/activate
          python3 -m pytest -v --tb=short -rA \
            --image-uri ${{ needs.preflight.outputs.image-uri }} \
            --region ${{ vars.AWS_REGION }} \
            test/tensorflow/integration/inference/test_conv_gpu.py \
            test/tensorflow/integration/inference/test_single_model_endpoint.py \
            test/tensorflow/integration/inference/test_multi_model_endpoint.py

      - name: Report non-blocking failure
        if: ${{ steps.tests.outcome == 'failure' }}
        run: echo "::warning::Blackwell SageMaker inference tests failed (non-blocking for this variant)."

  # Record a PASS row in the ci-images-table if the test passed. A Blackwell
  # build passes only once the Blackwell job has passed too, so a skipped or
  # failed G7 run never lets the result cache skip it on the next run.
  record-test-pass:
    if: >-
      ${{ always() && !cancelled() && !failure() &&
          inputs.image-content-hash != '' && inputs.suite-code-hash != '' &&
          needs.sagemaker-test.result == 'success' &&
          needs.sagemaker-test.outputs.tests-outcome == 'success' &&
          (needs.preflight.outputs.blackwell != 'true' || inputs.device-type != 'gpu' ||
           (needs.sagemaker-test-blackwell.result == 'success' &&
            needs.sagemaker-test-blackwell.outputs.tests-outcome == 'success')) }}
    needs: [preflight, sagemaker-test, sagemaker-test-blackwell]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/record-test-pass
        with:
          suite: tensorflow-inference/sagemaker
          image-content-hash: ${{ inputs.image-content-hash }}
          suite-code-hash: ${{ inputs.suite-code-hash }}
          ci-image-uri: ${{ inputs.image-uri }}
          ci-images-table-account-id: ${{ vars.CI_IMAGES_TABLE_ACCOUNT_ID }}

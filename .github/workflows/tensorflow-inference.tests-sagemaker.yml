name: Reusable TensorFlow SageMaker Inference Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""
      device-type:
        description: "Device type from config metadata (cpu|gpu). Selects the SM instance type for endpoint deploys. Required to fail closed on wiring bugs."
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

  sagemaker-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: ECR login
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      - name: Install test dependencies
        run: |
          python3 -m pip install -r test/requirements.txt -r test/tensorflow/integration/inference/requirements.txt

      - name: Run SageMaker inference tests
        env:
          PYTHONPATH: ${{ github.workspace }}/test
          SM_DEVICE_TYPE: ${{ inputs.device-type }}
        run: |
          MARK_FILTER=""
          if [ "${{ inputs.device-type }}" = "cpu" ]; then
            MARK_FILTER="-m not gpu"
          fi
          python3 -m pytest -v --tb=short -rA \
            --image-uri ${{ needs.preflight.outputs.image-uri }} \
            --region ${{ vars.AWS_REGION }} \
            $MARK_FILTER \
            test/tensorflow/integration/inference/

name: Reusable Miles Multi-GPU Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

  # gpu-efa-runners pods get four GPUs of a reserved p4d.24xlarge (A100) or p5.48xlarge
  # (H100); the job summary records which.
  multi-gpu-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    runs-on: gpu-efa-runners
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: ECR authenticate
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}

      # The SGLang test serves this model; it is the one the single-GPU tests use.
      - name: Download model from S3
        id: model
        uses: ./.github/actions/download-model
        with:
          s3-path: s3://dlc-cicd-models/llm-models/qwen3.5-0.8b.tar.gz
          model-name: qwen3.5-0.8b

      # Pass the pod's own GPUs to the container. No ports are published.
      - name: Start container
        env:
          IMAGE_URI: ${{ needs.preflight.outputs.image-uri }}
        run: |
          POD_GPUS=$(nvidia-smi --query-gpu=uuid --format=csv,noheader | paste -sd,)
          echo "Pod GPUs: ${POD_GPUS}"
          docker pull "${IMAGE_URI}"
          CONTAINER_ID=$(docker run -d --rm --init --gpus "\"device=${POD_GPUS}\"" \
            --shm-size=16g --ulimit memlock=-1 \
            -e MILES_TEST_MODEL_DIR=/models/qwen3.5-0.8b \
            "${IMAGE_URI}" sleep infinity)
          echo "CONTAINER_ID=${CONTAINER_ID}" >> "${GITHUB_ENV}"
          docker exec "${CONTAINER_ID}" nvidia-smi --query-gpu=name --format=csv,noheader \
            | sort | uniq -c | sed 's/^ */Multi-GPU tests ran on /' >> "${GITHUB_STEP_SUMMARY}"

      # The pods share a Docker daemon that cannot see the pod's files, so copy them in.
      - name: Copy tests and model into the container
        env:
          MODEL_DIR: ${{ steps.model.outputs.model-dir }}
        run: |
          docker cp test/miles "${CONTAINER_ID}:/tests"
          docker exec "${CONTAINER_ID}" mkdir -p /models
          docker cp "${MODEL_DIR}" "${CONTAINER_ID}:/models/qwen3.5-0.8b"

      # Run through the image entrypoint, which adds the CUDA forward-compat driver
      # when the host driver is older, as `docker run <image> <command>` would.
      - name: Run multi-GPU tests
        run: |
          docker exec "${CONTAINER_ID}" \
            miles-entrypoint python -m pytest -p no:cacheprovider /tests/multi_gpu/ -v

      - name: Cleanup
        if: always()
        env:
          LOCK_PID: ${{ steps.model.outputs.lock-pid }}
        run: |
          docker kill "${CONTAINER_ID}" >/dev/null 2>&1 || true
          if [[ -n "${LOCK_PID}" ]]; then kill "${LOCK_PID}" 2>/dev/null || true; fi

  # Upstream's own short GRPO runs on Qwen2.5-0.5B, from the Miles checkout in the
  # image. The disaggregated run trains with Megatron on two GPUs while SGLang serves
  # rollouts on the other two, pushing weights to the engines after every step; the
  # colocated run shares two GPUs between both. Miles' --ci-test mode, which both set,
  # checks that the trainer's log-probs match SGLang's and that every engine picks up
  # the new weights. They download the model and data from Hugging Face, as upstream.
  rl-e2e-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    runs-on: gpu-efa-runners
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: ECR authenticate
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Same source layout as upstream CI. No ports are published; Ray stays inside.
      - name: Start container
        env:
          IMAGE_URI: ${{ needs.preflight.outputs.image-uri }}
          HF_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          POD_GPUS=$(nvidia-smi --query-gpu=uuid --format=csv,noheader | paste -sd,)
          echo "Pod GPUs: ${POD_GPUS}"
          docker pull "${IMAGE_URI}"
          CONTAINER_ID=$(docker run -d --rm --init --gpus "\"device=${POD_GPUS}\"" \
            --shm-size=16g --ulimit memlock=-1 \
            -e HF_TOKEN \
            -e PYTHONPATH=/opt/miles:/opt/sglang/python:/opt/Megatron-LM \
            --workdir /opt/miles "${IMAGE_URI}" sleep infinity)
          echo "CONTAINER_ID=${CONTAINER_ID}" >> "${GITHUB_ENV}"
          docker exec "${CONTAINER_ID}" nvidia-smi --query-gpu=name --format=csv,noheader \
            | sort | uniq -c | sed 's/^ */RL end-to-end tests ran on /' >> "${GITHUB_STEP_SUMMARY}"

      - name: Run disaggregated GRPO (2 training GPUs, 2 rollout GPUs)
        run: |
          docker exec "${CONTAINER_ID}" \
            miles-entrypoint python tests/e2e/short/test_qwen2.5_0.5B_gsm8k_async_short.py

      - name: Run colocated GRPO (2 GPUs shared by training and rollout)
        if: ${{ !cancelled() }}
        run: |
          docker exec "${CONTAINER_ID}" \
            miles-entrypoint python tests/e2e/short/test_qwen2.5_0.5B_gsm8k_short.py

      - name: Cleanup
        if: always()
        run: docker kill "${CONTAINER_ID}" >/dev/null 2>&1 || true

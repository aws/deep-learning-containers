name: Reusable Miles Multi-GPU Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""
      instance-types:
        description: >-
          Comma-separated instance types with capacity reservations, in priority order;
          the first with free capacity runs the tests.
        required: false
        type: string
        default: "p4d.24xlarge,p4de.24xlarge"

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      image-exists: ${{ steps.check.outputs.exists }}
      customer-type: ${{ steps.config.outputs.customer-type }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Read customer type
        id: config
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
        run: echo "customer-type=$(yq '.metadata.customer_type' "${CONFIG_FILE}")" >> "${GITHUB_OUTPUT}"

  # The runner launches a reserved GPU instance and drives it over SSH; see
  # test/test_utils/gpu_instance.py. The same instance then runs upstream's short GRPO
  # runs and, for the EC2 image, its checkpoint-resume and SFT runs. They download their
  # models and data from Hugging Face, as upstream CI does.
  multi-gpu-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - name: Setup test dependencies
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt

      # The SGLang test serves this model; it is the one the single-GPU tests use.
      - name: Download model from S3
        id: model
        uses: ./.github/actions/download-model
        with:
          s3-path: s3://dlc-cicd-models/llm-models/qwen3.5-0.8b.tar.gz
          model-name: qwen3.5-0.8b
          min-free-gb: "20"

      - name: Run multi-GPU tests
        env:
          TEST_IMAGE_URI: ${{ needs.preflight.outputs.image-uri }}
          MILES_TEST_MODEL_DIR: ${{ steps.model.outputs.model-dir }}
          MULTI_GPU_INSTANCE_TYPES: ${{ inputs.instance-types }}
          MILES_CUSTOMER_TYPE: ${{ needs.preflight.outputs.customer-type }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          HF_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          source .venv/bin/activate
          PYTHONPATH="$(pwd)/test:${PYTHONPATH:-}" pytest -v --no-header \
            test/miles/multi_gpu/test_multi_gpu.py

      - name: Release model lock
        if: always()
        env:
          LOCK_PID: ${{ steps.model.outputs.lock-pid }}
        run: |
          if [[ -n "${LOCK_PID}" ]]; then kill "${LOCK_PID}" 2>/dev/null || true; fi

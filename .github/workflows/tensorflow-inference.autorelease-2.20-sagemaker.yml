name: "Auto Release - TensorFlow Inference 2.20 SageMaker"

on:
  # No `schedule:` yet — the image config is still `environment: gamma`, so a
  # cron here would autorelease into gamma on a schedule. The Tue/Thu 17:30 UTC
  # cron (matching tensorflow-training.autorelease-2.21-sagemaker.yml) is added
  # in the same PR that flips 2.20-inference-sagemaker-{cpu,cuda}.yml to
  # `environment: production`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.discover.outputs.configs }}
    steps:
      - uses: actions/checkout@v6
      - id: discover
        uses: ./.github/actions/discover-configs
        with:
          pattern: ".github/config/image/tensorflow/2.20-inference-sagemaker-*.yml"

  pipeline:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.configs) }}
    uses: ./.github/workflows/tensorflow-inference.pipeline.yml
    with:
      config-file: ${{ matrix.config_file }}
      tag-suffix: ${{ github.run_id }}
      run-security-test: true
      release: true
    secrets: inherit

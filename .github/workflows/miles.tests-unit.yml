name: Reusable Miles Unit Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
      target: ${{ steps.config.outputs.target }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Read build target
        id: config
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
        run: echo "target=$(yq -r '.build.target' "${CONFIG_FILE}")" >> "${GITHUB_OUTPUT}"

  unit-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: ECR login
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      # Test the image exactly as shipped: run its own pytest and install nothing,
      # so a missing dependency cannot be masked by the test harness. Mount only the
      # Miles tests: with the repository's test/ on the import path, folders such as
      # test/tensorflow pass for real packages to libraries that probe for them.
      - name: Run unit tests
        env:
          IMAGE_URI: ${{ needs.preflight.outputs.image-uri }}
          IMAGE_TARGET: ${{ needs.preflight.outputs.target }}
        run: |
          CONTAINER_ID=$(docker run -d --rm --entrypoint /bin/bash \
            -e MILES_IMAGE_TARGET="${IMAGE_TARGET}" \
            -v "$(pwd)/test/miles":/tests:ro \
            "${IMAGE_URI}" -c 'sleep infinity')
          trap 'docker kill "${CONTAINER_ID}" >/dev/null' EXIT
          docker exec "${CONTAINER_ID}" python -m pytest -p no:cacheprovider /tests/unit/ -v

name: Reusable Miles Upstream Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

  # Upstream's own CPU suites, run from the Miles checkout in the image with the
  # source layout upstream CPU CI sets up. --cadence release selects what upstream
  # gates a release on: every label, nightly tests included, no stop on first
  # failure. Nothing is installed, so the suites exercise the shipped environment.
  # stage-a-cpu is split four ways, as upstream CI splits it.
  cpu-suite:
    name: cpu-suite (${{ matrix.suite }}${{ matrix.partition-id && format(', partition {0}', matrix.partition-id) || '' }})
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: stage-a-cpu
            partition-id: "0"
          - suite: stage-a-cpu
            partition-id: "1"
          - suite: stage-a-cpu
            partition-id: "2"
          - suite: stage-a-cpu
            partition-id: "3"
          - suite: stage-b-cpu
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: ECR login
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      # --init reaps orphaned processes and the IPv6 loopback lets sockets bind ::1,
      # as on upstream's CI hosts; Miles' process-tree and dual-stack tests need both.
      - name: Start container
        env:
          IMAGE_URI: ${{ needs.preflight.outputs.image-uri }}
          HF_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          CONTAINER_ID=$(docker run -d --rm --init --entrypoint /bin/bash --shm-size=2g \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            -e HF_TOKEN \
            -e GITHUB_WORKSPACE=/opt/miles \
            -e SGLANG_SOURCE_ROOT=/opt/sglang/python \
            -e MEGATRON_SOURCE_ROOT=/opt/Megatron-LM \
            -e PYTHONPATH=/opt/miles:/opt/sglang/python:/opt/Megatron-LM \
            --workdir /opt/miles "${IMAGE_URI}" -c 'sleep infinity')
          echo "CONTAINER_ID=${CONTAINER_ID}" >> "${GITHUB_ENV}"

      - name: Verify source resolution
        run: docker exec "${CONTAINER_ID}" python tests/ci/verify_source_resolution.py

      # Skipped files are removed from this throwaway container only; `rm` without
      # -f fails on a stale entry, so the list is revisited when Miles is bumped.
      # Skipped node IDs are deselected through PYTEST_ADDOPTS.
      - name: Apply skip list
        run: |
          skips="${RUNNER_TEMP}/skipped_tests.txt"
          { grep -vE '^\s*(#|$)' test/miles/upstream/skipped_tests.txt || true; } > "${skips}"
          { grep -v '::' "${skips}" || true; } | docker exec -i "${CONTAINER_ID}" xargs -r rm --
          echo "PYTEST_ADDOPTS=$({ grep '::' "${skips}" || true; } | sed 's/^/--deselect=/' | paste -sd ' ' -)" \
            >> "${GITHUB_ENV}"

      # CPU hosts have no driver. The image's CUDA forward-compat libcuda lets GPU
      # libraries such as TransformerEngine load, as they would on a GPU host.
      - name: Run ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
          PARTITION_ID: ${{ matrix.partition-id }}
        run: |
          docker exec -e SUITE -e PARTITION_ID -e PYTEST_ADDOPTS "${CONTAINER_ID}" bash -c '
            export LD_LIBRARY_PATH="/usr/local/cuda/compat:${LD_LIBRARY_PATH}"
            args=(--hw cpu --suite "${SUITE}" --cadence release)
            if [[ -n "${PARTITION_ID}" ]]; then
              args+=(--auto-partition-id "${PARTITION_ID}" --auto-partition-size 4)
            fi
            python tests/ci/run_suite.py "${args[@]}"'

      - name: Cleanup
        if: always()
        run: docker kill "${CONTAINER_ID}" >/dev/null 2>&1 || true

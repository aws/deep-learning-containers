name: Reusable EFA Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""
      efa-instance-type:
        description: "EFA-enabled instance type (default: p4d.24xlarge)"
        required: false
        type: string
        default: "p4d.24xlarge"
      run-nixl-tests:
        description: "Run NIXL libfabric smoke test"
        required: false
        type: boolean
        default: false
      run-nixl-disagg:
        description: "Run NIXL disaggregated PD test (vLLM only)"
        required: false
        type: boolean
        default: true
      container-entrypoint:
        description: "Override container entrypoint (e.g., /bin/bash for vLLM)"
        required: false
        type: string
        default: ""
      container-cmd:
        description: "CMD passed to container (default: bash)"
        required: false
        type: string
        default: "bash"
      image-content-hash:
        description: "Image hash computed from hash_image_content.py for caching a test pass."
        required: false
        type: string
        default: ""
      suite-code-hash:
        description: "Test code hash computed from hash_suite_code.py for caching a test pass."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  efa-test:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    timeout-minutes: 60
    outputs:
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Setup test dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt

      - name: Run EFA integration test
        if: steps.check.outputs.exists == 'true'
        env:
          TEST_IMAGE_URI: ${{ steps.image.outputs.image-uri }}
          EFA_INSTANCE_TYPE: ${{ inputs.efa-instance-type }}
          RUN_NIXL_TESTS: ${{ inputs.run-nixl-tests && '1' || '0' }}
          RUN_NIXL_DISAGG: ${{ inputs.run-nixl-disagg && '1' || '0' }}
          EFA_CONTAINER_ENTRYPOINT: ${{ inputs.container-entrypoint }}
          EFA_CONTAINER_CMD: ${{ inputs.container-cmd }}
        run: |
          source .venv/bin/activate
          PYTHONPATH=$(pwd)/test:$PYTHONPATH \
          python -m pytest test/efa/test_efa.py -vs -rA --tb=long

      - name: Skip notice
        if: steps.check.outputs.exists != 'true'
        run: echo "Image not found in ECR — skipping tests (first release scenario)"

  # Record a PASS row in the ci-images-table if the test ran and passed.
  # Require the image to exist since the efa-test job records 'success'
  # even if the ECR read fails, which would record a PASS row for a test
  # that never actually ran.
  record-test-pass:
    if: >-
      ${{ always() && !cancelled() && !failure() &&
          inputs.image-content-hash != '' && inputs.suite-code-hash != '' &&
          needs.efa-test.result == 'success' &&
          needs.efa-test.outputs.image-exists == 'true' }}
    needs: [efa-test]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/record-test-pass
        with:
          suite: efa
          image-content-hash: ${{ inputs.image-content-hash }}
          suite-code-hash: ${{ inputs.suite-code-hash }}
          ci-images-table-account-id: ${{ vars.CI_IMAGES_TABLE_ACCOUNT_ID }}

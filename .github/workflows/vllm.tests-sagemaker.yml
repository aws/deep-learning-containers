name: Reusable vLLM SageMaker Tests

# preflight splits .github/config/model-tests/vllm-sagemaker-endpoint-tests.yml (the CPU
# config for CPU images) into fleet entries (local-test-models) and instance_type entries
# (endpoint-test-models). The config header describes both.

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""
      image-content-hash:
        description: "Image hash computed from hash_image_content.py for caching a test pass."
        required: false
        type: string
        default: ""
      suite-code-hash:
        description: "Test code hash computed from hash_suite_code.py for caching a test pass."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
      local-matrix: ${{ steps.split.outputs.local-matrix || '[]' }}
      endpoint-matrix: ${{ steps.split.outputs.endpoint-matrix || '[]' }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Parse sagemaker config
        if: steps.check.outputs.exists == 'true'
        id: parse
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install pyyaml
          DEVICE_TYPE=$(python3 -c "import yaml; print(yaml.safe_load(open('${{ inputs.config-file }}'))['metadata']['device_type'])")
          CONFIG=.github/config/model-tests/vllm-sagemaker-endpoint-tests.yml
          if [ "${DEVICE_TYPE}" = "cpu" ]; then
            CONFIG=.github/config/model-tests/vllm-cpu-sagemaker-endpoint-tests.yml
          fi
          python3 scripts/ci/parse_model_config.py \
            --config "${CONFIG}" \
            --section sagemaker \
            --image-config "${{ inputs.config-file }}"

      - name: Split matrix into local and endpoint entries
        if: steps.check.outputs.exists == 'true'
        id: split
        env:
          MATRIX: ${{ steps.parse.outputs.matrix }}
        run: |
          # Exactly one of a string fleet or instance_type, and s3_model (or hf_model with fleet).
          VALID='def valid: (if has("fleet") then (.fleet | type) == "string" and (has("instance_type") | not)
            else has("instance_type") end) and (.model_source == "s3" or (.model_source == "hf" and has("fleet")));'
          if ! jq -e "${VALID} all(.[]; valid)" <<< "${MATRIX}" > /dev/null; then
            INVALID=$(jq -r "${VALID} [.[] | select(valid | not) | .name] | join(\", \")" <<< "${MATRIX}")
            echo "::error::Each sagemaker entry needs exactly one of a string fleet (local) or instance_type (real endpoint), and an s3_model, or an hf_model with fleet; fix: ${INVALID}"
            exit 1
          fi
          LOCAL_MATRIX=$(jq -c '[.[] | select(has("fleet"))]' <<< "${MATRIX}")
          ENDPOINT_MATRIX=$(jq -c '[.[] | select(has("fleet") | not)]' <<< "${MATRIX}")
          echo "local-matrix=${LOCAL_MATRIX}" >> "${GITHUB_OUTPUT}"
          echo "endpoint-matrix=${ENDPOINT_MATRIX}" >> "${GITHUB_OUTPUT}"

  # One job per fleet entry, on that GPU fleet (see the config header).
  local-test-models:
    name: local-test (${{ matrix.model.name }})
    if: ${{ needs.preflight.outputs.image-exists == 'true' && fromJson(needs.preflight.outputs.local-matrix)[0] != null }}
    needs: [preflight]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.preflight.outputs.local-matrix) }}
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:${{ matrix.model.fleet }}
        buildspec-override:true
    env:
      SM_MODEL_NAME: ${{ matrix.model.name }}
      SM_LOCAL_CONTAINER: sm-local-serving
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: ECR authenticate
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      - name: Download model from S3
        if: matrix.model.model_source == 's3'
        uses: ./.github/actions/download-model
        id: model
        with:
          s3-path: ${{ matrix.model.s3_path }}
          model-name: ${{ matrix.model.name }}

      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt
          uv pip install -r test/vllm/sagemaker/requirements.txt

      - name: Start container
        run: |
          source .venv/bin/activate
          ENV_FILE="${RUNNER_TEMP}/sm-local.env"
          python3 test/vllm/sagemaker/amzn2023/sm_serving_common.py \
            --model-name "${SM_MODEL_NAME}" > "${ENV_FILE}"
          DOCKER_ARGS=(-d --name "${SM_LOCAL_CONTAINER}" --gpus all --shm-size=4g --env-file "${ENV_FILE}")
          if [[ "${{ matrix.model.model_source }}" == "s3" ]]; then
            DOCKER_ARGS+=(-v "${{ steps.model.outputs.model-dir }}:/opt/ml/model:ro")
          else
            # The token reaches docker only through its environment: -e by name, never the value.
            HF_TOKEN=$(aws secretsmanager get-secret-value --region "${{ vars.AWS_REGION }}" \
              --secret-id test/hf_token --query SecretString --output text | jq -er .HF_TOKEN)
            echo "::add-mask::${HF_TOKEN}"
            export HF_TOKEN
            DOCKER_ARGS+=(-e HF_TOKEN)
          fi
          if [[ "${{ matrix.model.network_isolation }}" == "true" ]]; then
            DOCKER_ARGS+=(--network none)
          else
            DOCKER_ARGS+=(-p 127.0.0.1:8080:8080)
          fi
          docker run "${DOCKER_ARGS[@]}" "${{ needs.preflight.outputs.image-uri }}" serve

      - name: Run SageMaker local serving test
        run: |
          source .venv/bin/activate
          cd test/
          python3 -m pytest -vs -rA vllm/sagemaker/amzn2023/test_sm_local_serving.py

      - name: Dump container logs
        if: always()
        run: docker logs --tail 500 "${SM_LOCAL_CONTAINER}" 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "${SM_LOCAL_CONTAINER}" 2>/dev/null || true
          if [[ -n "${{ steps.model.outputs.lock-pid }}" ]]; then
            kill "${{ steps.model.outputs.lock-pid }}" 2>/dev/null || true
          fi
          docker rmi "${{ needs.preflight.outputs.image-uri }}" 2>/dev/null || true
          rm -rf /dlc-models

  # One job per instance_type entry, on a real SageMaker endpoint (see the config header).
  # max-parallel 1 keeps a single endpoint live at a time.
  endpoint-test-models:
    name: endpoint-test (${{ matrix.model.name }})
    if: ${{ needs.preflight.outputs.image-exists == 'true' && fromJson(needs.preflight.outputs.endpoint-matrix)[0] != null }}
    needs: [preflight]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: ${{ fromJson(needs.preflight.outputs.endpoint-matrix) }}
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt
          uv pip install -r test/vllm/sagemaker/requirements.txt

      - name: Run SageMaker endpoint test
        env:
          SM_MODEL_NAME: ${{ matrix.model.name }}
        run: |
          source .venv/bin/activate
          cd test/
          python3 -m pytest -vs -rA --image-uri ${{ needs.preflight.outputs.image-uri }} \
            vllm/sagemaker/amzn2023/test_sm_model_serving.py

  # Record a PASS row in the ci-images-table when neither test job failed or was cancelled
  # and at least one of them succeeded.
  record-test-pass:
    if: >-
      ${{ always() && !cancelled() && !failure() &&
          inputs.image-content-hash != '' && inputs.suite-code-hash != '' &&
          (needs.local-test-models.result == 'success' || needs.local-test-models.result == 'skipped') &&
          (needs.endpoint-test-models.result == 'success' || needs.endpoint-test-models.result == 'skipped') &&
          (needs.local-test-models.result == 'success' || needs.endpoint-test-models.result == 'success') }}
    needs: [preflight, local-test-models, endpoint-test-models]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/record-test-pass
        with:
          suite: vllm/sagemaker
          image-content-hash: ${{ inputs.image-content-hash }}
          suite-code-hash: ${{ inputs.suite-code-hash }}
          ci-image-uri: ${{ inputs.image-uri }}
          ci-images-table-account-id: ${{ vars.CI_IMAGES_TABLE_ACCOUNT_ID }}

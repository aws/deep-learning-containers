# Lambda pipeline — builds one Lambda image variant, runs tests, optionally releases.
# Lambda uses a single Dockerfile with multiple --target stages (one per variant).

name: "Pipeline - Lambda"

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      tag-suffix:
        description: "CI tag suffix (run_id or pr-NUMBER)"
        required: true
        type: string
      build:
        description: "Whether to build the image (false = skip build, test against prod)"
        required: false
        type: boolean
        default: true
      run-sanity-test:
        description: "Run sanity tests"
        required: false
        type: boolean
        default: true
      run-security-test:
        description: "Run security tests"
        required: false
        type: boolean
        default: true
      run-telemetry-test:
        description: "Run telemetry tests"
        required: false
        type: boolean
        default: true
      run-validation-test:
        description: "Run GPU validation tests"
        required: false
        type: boolean
        default: true
      run-ric-topology-test:
        description: "Run real-Lambda RIC concurrency-mode topology tests"
        required: false
        type: boolean
        default: false
      run-sglang-upstream-test:
        description: "Run the upstream SGLang suite (sglang variant only)"
        required: false
        type: boolean
        default: false
      run-vllm-upstream-test:
        description: "Run the upstream vLLM suite (vllm variant only)"
        required: false
        type: boolean
        default: false
      release:
        description: "Run release job after tests pass"
        required: false
        type: boolean
        default: false
    outputs:
      image-uri:
        description: "Built image URI (empty if build was skipped)"
        value: ${{ jobs.build.outputs.image-uri }}

jobs:
  build:
    if: ${{ inputs.build }}
    concurrency:
      group: ${{ github.workflow }}-build-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:x86-build-runner
        buildspec-override:true
    timeout-minutes: 360
    outputs:
      image-uri: ${{ steps.build.outputs.image-uri }}
    steps:
      - uses: actions/checkout@v6
      - id: build
        uses: ./.github/actions/build-image
        with:
          config-file: ${{ inputs.config-file }}
          aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          tag-suffix: ${{ inputs.tag-suffix }}

  # Check to see which tests have passed before on the given image build
  check:
    if: ${{ always() && !failure() && !cancelled() }}
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-check-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/_reusable.check-test-pass.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}
      suites: '["sanity", "telemetry"]'

  sanity-test:
    if: ${{ always() && !cancelled() && inputs.run-sanity-test && needs.build.result != 'failure' && fromJSON(needs.check.outputs.skips || '{}')['sanity'] != true }}
    needs: [build, check]
    concurrency:
      group: ${{ github.workflow }}-sanity-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/_reusable.sanity-tests.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}
      image-content-hash: ${{ needs.check.outputs.image-content-hash }}
      suite-code-hash: ${{ fromJSON(needs.check.outputs.suite-code-hashes || '{}')['sanity'] || '' }}

  security-test:
    if: ${{ always() && !failure() && !cancelled() && inputs.run-security-test }}
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-security-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/_reusable.security-tests.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}

  telemetry-test:
    if: ${{ always() && !cancelled() && inputs.run-telemetry-test && needs.build.result != 'failure' && fromJSON(needs.check.outputs.skips || '{}')['telemetry'] != true }}
    needs: [build, check]
    concurrency:
      group: ${{ github.workflow }}-telemetry-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/_reusable.telemetry-tests.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}
      image-content-hash: ${{ needs.check.outputs.image-content-hash }}
      suite-code-hash: ${{ fromJSON(needs.check.outputs.suite-code-hashes || '{}')['telemetry'] || '' }}

  # GPU validation — Lambda-specific pytest suite run inside the container
  validation-test:
    if: ${{ always() && !failure() && !cancelled() && inputs.run-validation-test }}
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-validation-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:x86-g6xl-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ needs.build.outputs.image-uri || '' }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: ECR login
        if: steps.check.outputs.exists == 'true'
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ steps.image.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Determine validation tests
        if: steps.check.outputs.exists == 'true'
        id: config
        run: |
          TARGET=$(yq '.build.target' "${{ inputs.config-file }}")
          COMMON="/test/unit/test_python.py /test/unit/test_environment.py /test/unit/test_lambda_runtime.py /test/unit/test_cuda.py"
          case "$TARGET" in
            *pytorch*)
              TESTS="$COMMON /test/unit/test_imports_pytorch.py /test/unit/test_environment_pytorch.py /test/unit/test_ffmpeg.py /test/single_gpu/test_pytorch_inference.py /test/single_gpu/test_pytorch_pipelines.py /test/single_gpu/test_ffmpeg_gpu.py" ;;
            *cupy*)
              TESTS="$COMMON /test/unit/test_imports_cupy.py /test/single_gpu/test_cupy_cuda.py /test/single_gpu/test_cupy_workloads.py" ;;
            *sglang*)
              TESTS="$COMMON /test/unit/test_imports_sglang.py /test/unit/test_runai_streamer.py /test/single_gpu/test_sglang_inference.py" ;;
            *vllm*)
              TESTS="$COMMON /test/unit/test_imports_vllm.py /test/unit/test_runai_streamer.py /test/single_gpu/test_vllm_inference.py" ;;
            *base*)
              TESTS="$COMMON /test/unit/test_imports_base.py" ;;
          esac
          echo "tests=${TESTS}" >> $GITHUB_OUTPUT
          # Multi-mode RIC targets carry a runtime concurrency-mode knob.
          if [[ "$TARGET" == *preview* ]]; then
            echo "multimode=true" >> $GITHUB_OUTPUT
          else
            echo "multimode=false" >> $GITHUB_OUTPUT
          fi
          # Serving engine
          if [[ "$TARGET" == *vllm* ]]; then echo "engine=vllm" >> $GITHUB_OUTPUT;
          elif [[ "$TARGET" == *sglang* ]]; then echo "engine=sglang" >> $GITHUB_OUTPUT;
          else echo "engine=none" >> $GITHUB_OUTPUT; fi

      - name: Run GPU validation tests
        if: steps.check.outputs.exists == 'true'
        run: |
          docker run --rm --gpus all --entrypoint python \
            -v $(pwd)/test/lambda:/test \
            ${{ steps.image.outputs.image-uri }} \
            -m pytest ${{ steps.config.outputs.tests }} -v

      - name: Run RIE topology test
        if: steps.check.outputs.exists == 'true' && steps.config.outputs.multimode == 'true'
        run: |
          chmod +x test/lambda/single_gpu/rie_topology_check.sh
          bash test/lambda/single_gpu/rie_topology_check.sh \
            ${{ steps.image.outputs.image-uri }} 8 "thread process hybrid" "${{ steps.config.outputs.engine }}"

      - name: Verify runtime concurrency-mode override
        if: steps.check.outputs.exists == 'true' && steps.config.outputs.multimode == 'true'
        run: |
          for mode in process thread hybrid; do
            echo "::group::override AWS_LAMBDA_CONCURRENCY_MODE=${mode}"
            docker run --rm --gpus all --entrypoint python \
              -e AWS_LAMBDA_CONCURRENCY_MODE=${mode} \
              -e EXPECTED_CONCURRENCY_MODE=${mode} \
              -v $(pwd)/test/lambda:/test \
              ${{ steps.image.outputs.image-uri }} \
              -m pytest /test/unit/test_lambda_runtime.py::test_ric_resolves_container_env -v
            echo "::endgroup::"
          done

      - name: Run runai S3 streaming test
        if: steps.check.outputs.exists == 'true' && steps.config.outputs.engine != 'none'
        run: |
          chmod +x test/lambda/single_gpu/runai_s3_check.sh
          bash test/lambda/single_gpu/runai_s3_check.sh \
            ${{ steps.image.outputs.image-uri }} "${{ steps.config.outputs.engine }}"

  lambdaric-topology-test:
    if: ${{ always() && !failure() && !cancelled() && inputs.run-ric-topology-test && contains(inputs.config-file, 'preview') }}
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-real-ric-topology-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:x86-build-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: Resolve base image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ needs.build.outputs.image-uri || '' }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check base image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Classify engine
        if: steps.check.outputs.exists == 'true'
        id: cfg
        run: |
          TARGET=$(yq '.build.target // ""' "${{ inputs.config-file }}")
          if [[ "$TARGET" == *vllm* ]]; then echo "engine=vllm" >> "$GITHUB_OUTPUT";
          elif [[ "$TARGET" == *sglang* ]]; then echo "engine=sglang" >> "$GITHUB_OUTPUT";
          else echo "engine=none" >> "$GITHUB_OUTPUT"; fi

      - name: Build + push test-overlay image
        if: steps.check.outputs.exists == 'true'
        id: overlay
        env:
          BASE_URI: ${{ steps.image.outputs.image-uri }}
          BASE_ACCT: ${{ steps.image.outputs.aws-account-id }}
          CI_ACCT: ${{ vars.CI_AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          BASE_TAG="${BASE_URI##*:}"
          OVERLAY_URI="${CI_ACCT}.dkr.ecr.${REGION}.amazonaws.com/ci:${BASE_TAG}-rictest"
          # pull base from its resolved account (CI on build; PROD on test-against-prod)
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "${BASE_ACCT}.dkr.ecr.${REGION}.amazonaws.com"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "${CI_ACCT}.dkr.ecr.${REGION}.amazonaws.com"
          docker build --progress=plain -f test/lambda/platform/Dockerfile.test \
            --build-arg BASE_IMAGE="$BASE_URI" -t "$OVERLAY_URI" test/lambda/platform
          docker push "$OVERLAY_URI"
          echo "overlay-uri=$OVERLAY_URI" >> "$GITHUB_OUTPUT"

      - name: Register preview lambda-sdk model
        if: steps.check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          aws s3 cp s3://dlc-cicd-wheels/lambda-sdk/lambda-2015-03-31.normal.json /tmp/lambda-sdk-model.json
          aws configure add-model --service-name lambda-sdk --service-model file:///tmp/lambda-sdk-model.json

      - name: Setup python deps
        if: steps.check.outputs.exists == 'true'
        run: uv pip install --system --quiet boto3

      - name: Run real-Lambda RIC topology test
        if: steps.check.outputs.exists == 'true'
        run: |
          python3 test/lambda/platform/run_topology.py \
            --image "${{ steps.overlay.outputs.overlay-uri }}" \
            --region "${{ vars.AWS_REGION }}" \
            --capacity-provider-arn "${{ vars.LMI_CAPACITY_PROVIDER_ARN }}" \
            --execution-role-arn "${{ vars.LMI_EXECUTION_ROLE_ARN }}" \
            --engine "${{ steps.cfg.outputs.engine }}"

  sglang-upstream-test:
    if: ${{ always() && !failure() && !cancelled() && inputs.run-sglang-upstream-test }}
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-sglang-upstream-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/sglang.tests-upstream.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}
      # These base-a-test-1-gpu-small tests require gated meta-llama/Llama-3.1-8B,
      # which the CI HF token cannot access. The remaining suite tests are ungated.
      skip-tests: >-
        registered/core/test_basic_sanity.py
        registered/core/test_basic_sanity_eagle3.py
        registered/core/test_basic_sanity_dflash.py

  vllm-upstream-test:
    if: ${{ always() && !failure() && !cancelled() && inputs.run-vllm-upstream-test }}
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-vllm-upstream-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/vllm.tests-upstream.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}
    secrets: inherit

  release-gate:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lambda') &&
      (contains(github.workflow_ref, '.autorelease') || contains(github.workflow_ref, '.dispatch-release')) &&
      !contains(github.workflow_ref, '.pr') &&
      inputs.release &&
      !failure() && !cancelled() &&
      needs.build.result == 'success'
    needs: [build, sanity-test, security-test, telemetry-test, validation-test, lambdaric-topology-test, sglang-upstream-test, vllm-upstream-test]
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      release-spec: ${{ steps.spec.outputs.release-spec }}
      environment: ${{ steps.check.outputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          SHOULD_RELEASE=$(yq '.release.release' "${{ inputs.config-file }}")
          ENVIRONMENT=$(yq '.release.environment' "${{ inputs.config-file }}")
          echo "should-release=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
      - id: spec
        if: steps.check.outputs.should-release == 'true'
        uses: ./.github/actions/generate-release-spec
        with:
          config-file: ${{ inputs.config-file }}

  release:
    if: ${{ !failure() && !cancelled() && needs.release-gate.outputs.should-release == 'true' }}
    needs: [build, release-gate]
    uses: ./.github/workflows/_reusable.release-image.yml
    with:
      source-image-uri: ${{ needs.build.outputs.image-uri }}
      release-spec: ${{ needs.release-gate.outputs.release-spec }}
      environment: ${{ needs.release-gate.outputs.environment }}
      aws-region: ${{ vars.AWS_REGION }}
    secrets: inherit

  notify-failure:
    # Notify Slack immediately when an auto-release/dispatch-release run fails.
    # Guarded on release context so PR runs never notify.
    if: >-
      failure() &&
      github.ref == 'refs/heads/main' &&
      (contains(github.workflow_ref, '.autorelease') || contains(github.workflow_ref, '.dispatch-release')) &&
      !contains(github.workflow_ref, '.pr') &&
      inputs.release
    needs: [build, sanity-test, security-test, telemetry-test, validation-test, lambdaric-topology-test, sglang-upstream-test, vllm-upstream-test, release-gate, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_RELEASE_FAILURE_WEBHOOK_URL }}
          workflow-name: ${{ github.workflow }}
          config-file: ${{ inputs.config-file }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

# Lambda pipeline — builds one Lambda image variant, runs tests, optionally releases.
# Lambda uses a single Dockerfile with multiple --target stages (one per variant).

name: "Pipeline - Lambda"

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      tag-suffix:
        description: "CI tag suffix (run_id or pr-NUMBER)"
        required: true
        type: string
      build:
        description: "Whether to build the image (false = skip build, test against prod)"
        required: false
        type: boolean
        default: true
      run-sanity-test:
        description: "Run sanity tests"
        required: false
        type: boolean
        default: true
      run-security-test:
        description: "Run security tests"
        required: false
        type: boolean
        default: true
      run-telemetry-test:
        description: "Run telemetry tests"
        required: false
        type: boolean
        default: true
      run-validation-test:
        description: "Run GPU validation tests"
        required: false
        type: boolean
        default: true
      run-managed-instances-test:
        description: "Run the RIC invoke test on real Lambda"
        required: false
        type: boolean
        default: true
      run-sglang-upstream-test:
        description: "Run the upstream SGLang suite (sglang variant only)"
        required: false
        type: boolean
        default: false
      run-vllm-upstream-test:
        description: "Run the upstream vLLM suite (vllm variant only)"
        required: false
        type: boolean
        default: false
      release:
        description: "Run release job after tests pass"
        required: false
        type: boolean
        default: false
    outputs:
      image-uri:
        description: "Built image URI (empty if build was skipped)"
        value: ${{ jobs.build.outputs.image-uri }}

jobs:
  build:
    if: ${{ inputs.build }}
    concurrency:
      group: ${{ github.workflow }}-build-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:x86-build-runner
        buildspec-override:true
    timeout-minutes: 360
    outputs:
      image-uri: ${{ steps.build.outputs.image-uri }}
    steps:
      - uses: actions/checkout@v6
      - id: build
        uses: ./.github/actions/build-image
        with:
          config-file: ${{ inputs.config-file }}
          aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          tag-suffix: ${{ inputs.tag-suffix }}

  # Check to see which tests have passed before on the given image build
  check:
    if: ${{ always() && !failure() && !cancelled() }}
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-check-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/_reusable.check-test-pass.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}
      suites: '["sanity", "telemetry", "sglang/upstream"]'

  sanity-test:
    if: ${{ always() && !cancelled() && inputs.run-sanity-test && needs.build.result != 'failure' && fromJSON(needs.check.outputs.skips || '{}')['sanity'] != true }}
    needs: [build, check]
    concurrency:
      group: ${{ github.workflow }}-sanity-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/_reusable.sanity-tests.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}
      image-content-hash: ${{ needs.check.outputs.image-content-hash }}
      suite-code-hash: ${{ fromJSON(needs.check.outputs.suite-code-hashes || '{}')['sanity'] || '' }}

  security-test:
    if: ${{ always() && !failure() && !cancelled() && inputs.run-security-test }}
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-security-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/_reusable.security-tests.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}

  telemetry-test:
    if: ${{ always() && !cancelled() && inputs.run-telemetry-test && needs.build.result != 'failure' && fromJSON(needs.check.outputs.skips || '{}')['telemetry'] != true }}
    needs: [build, check]
    concurrency:
      group: ${{ github.workflow }}-telemetry-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/_reusable.telemetry-tests.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}
      image-content-hash: ${{ needs.check.outputs.image-content-hash }}
      suite-code-hash: ${{ fromJSON(needs.check.outputs.suite-code-hashes || '{}')['telemetry'] || '' }}

  # GPU validation — Lambda-specific pytest suite run inside the container
  validation-test:
    if: ${{ always() && !failure() && !cancelled() && inputs.run-validation-test }}
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-validation-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:x86-g6xl-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ needs.build.outputs.image-uri || '' }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: ECR login
        if: steps.check.outputs.exists == 'true'
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ steps.image.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Determine validation tests
        if: steps.check.outputs.exists == 'true'
        id: config
        run: |
          TARGET=$(yq '.build.target' "${{ inputs.config-file }}")
          COMMON="/test/unit/test_python.py /test/unit/test_environment.py /test/unit/test_lambda_runtime.py /test/unit/test_cuda.py /test/unit/test_entrypoint.py"
          case "$TARGET" in
            *pytorch*)
              TESTS="$COMMON /test/unit/test_imports_pytorch.py /test/unit/test_environment_pytorch.py /test/unit/test_ffmpeg.py /test/single_gpu/test_pytorch_inference.py /test/single_gpu/test_pytorch_pipelines.py /test/single_gpu/test_ffmpeg_gpu.py" ;;
            *cupy*)
              TESTS="$COMMON /test/unit/test_imports_cupy.py /test/unit/test_environment_cupy.py /test/unit/test_numba_cuda.py /test/single_gpu/test_cupy_cuda.py /test/single_gpu/test_cupy_workloads.py" ;;
            *sglang*)
              TESTS="$COMMON /test/unit/test_imports_sglang.py /test/unit/test_runai_streamer.py /test/unit/test_handler_concurrency.py /test/single_gpu/test_sglang_inference.py" ;;
            *vllm*)
              TESTS="$COMMON /test/unit/test_imports_vllm.py /test/unit/test_runai_streamer.py /test/unit/test_modelscope.py /test/unit/test_handler_concurrency.py /test/single_gpu/test_vllm_inference.py" ;;
            *base*)
              TESTS="$COMMON /test/unit/test_imports_base.py" ;;
          esac
          echo "tests=${TESTS}" >> $GITHUB_OUTPUT
          # Serving engine
          if [[ "$TARGET" == *vllm* ]]; then echo "engine=vllm" >> $GITHUB_OUTPUT;
          elif [[ "$TARGET" == *sglang* ]]; then echo "engine=sglang" >> $GITHUB_OUTPUT;
          else echo "engine=none" >> $GITHUB_OUTPUT; fi

      - name: Run GPU validation tests
        if: steps.check.outputs.exists == 'true'
        run: |
          docker run --rm --gpus all --entrypoint python \
            -v $(pwd)/test/lambda:/test \
            ${{ steps.image.outputs.image-uri }} \
            -m pytest ${{ steps.config.outputs.tests }} -v

      - name: Run RIE invoke check
        if: steps.check.outputs.exists == 'true'
        run: |
          chmod +x test/lambda/single_gpu/rie_invoke_check.sh
          bash test/lambda/single_gpu/rie_invoke_check.sh \
            ${{ steps.image.outputs.image-uri }} 4 "${{ steps.config.outputs.engine }}"

      - name: Run runai S3 streaming test
        if: steps.check.outputs.exists == 'true' && steps.config.outputs.engine != 'none'
        run: |
          chmod +x test/lambda/single_gpu/runai_s3_check.sh
          bash test/lambda/single_gpu/runai_s3_check.sh \
            ${{ steps.image.outputs.image-uri }} "${{ steps.config.outputs.engine }}"

  managed-instances-test:
    if: ${{ always() && !failure() && !cancelled() && inputs.run-managed-instances-test }}
    needs: [build]
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-managed-instances-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:x86-build-runner
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ needs.build.outputs.image-uri || '' }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: ECR login
        if: steps.check.outputs.exists == 'true'
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ steps.image.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Determine engine
        if: steps.check.outputs.exists == 'true'
        id: config
        run: |
          TARGET=$(yq '.build.target' "${{ inputs.config-file }}")
          if [[ "$TARGET" == *vllm* ]]; then echo "engine=vllm" >> $GITHUB_OUTPUT;
          elif [[ "$TARGET" == *sglang* ]]; then echo "engine=sglang" >> $GITHUB_OUTPUT;
          else echo "engine=none" >> $GITHUB_OUTPUT; fi
          LIBS="awslambdaric,boto3"
          if [[ "$TARGET" != base-* && "$TARGET" != cupy-* ]]; then LIBS="${LIBS},torch"; fi
          echo "libs=${LIBS}" >> $GITHUB_OUTPUT
          echo "config=$(basename "${{ inputs.config-file }}" .yml)" >> $GITHUB_OUTPUT

      - name: Push probe overlay
        if: steps.check.outputs.exists == 'true'
        id: overlay
        run: |
          REGISTRY="${{ vars.CI_AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          OVERLAY="${REGISTRY}/ci:ric-probe-${{ inputs.tag-suffix }}-${{ steps.config.outputs.config }}"
          docker build -f test/lambda/managed_instances/Dockerfile.test \
            --build-arg BASE_IMAGE=${{ steps.image.outputs.image-uri }} \
            -t "$OVERLAY" test/lambda
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker push "$OVERLAY"
          echo "overlay=${OVERLAY}" >> $GITHUB_OUTPUT

      - name: Install driver dependencies
        if: steps.check.outputs.exists == 'true'
        run: python3 -m pip install boto3 -q

      - name: Run RIC invoke test on real Lambda
        if: steps.check.outputs.exists == 'true'
        run: |
          # Engines need room to load a model; the default fits the smallest instance.
          MEMORY=4096
          if [ "${{ steps.config.outputs.engine }}" != "none" ]; then MEMORY=24576; fi
          python3 test/lambda/managed_instances/run_managed_instances.py \
            --image "${{ steps.overlay.outputs.overlay }}" \
            --region ${{ vars.AWS_REGION }} \
            --capacity-provider-arn "arn:aws:lambda:${{ vars.AWS_REGION }}:${{ vars.CI_AWS_ACCOUNT_ID }}:capacity-provider:lambda-lmi-gpu-cp" \
            --execution-role-arn "arn:aws:iam::${{ vars.CI_AWS_ACCOUNT_ID }}:role/lambda-lmi-gpu-execution-role-${{ vars.AWS_REGION }}" \
            --engine "${{ steps.config.outputs.engine }}" \
            --libs "${{ steps.config.outputs.libs }}" \
            --memory-size "$MEMORY" \
            --function-name "rictest-${{ inputs.tag-suffix }}-${{ steps.config.outputs.config }}"

  sglang-upstream-test:
    if: >-
      ${{ always() && !cancelled() && inputs.run-sglang-upstream-test &&
          needs.build.result != 'failure' &&
          fromJSON(needs.check.outputs.skips || '{}')['sglang/upstream'] != true }}
    needs: [build, check]
    concurrency:
      group: ${{ github.workflow }}-sglang-upstream-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/sglang.tests-upstream.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}
      image-content-hash: ${{ needs.check.outputs.image-content-hash }}
      suite-code-hash: ${{ fromJSON(needs.check.outputs.suite-code-hashes || '{}')['sglang/upstream'] || '' }}
      # These base-a-test-1-gpu-small tests require gated meta-llama/Llama-3.1-8B,
      # which the CI HF token cannot access. The remaining suite tests are ungated.
      skip-tests: >-
        registered/core/test_basic_sanity.py
        registered/core/test_basic_sanity_eagle3.py
        registered/core/test_basic_sanity_dflash.py

  vllm-upstream-test:
    if: ${{ always() && !failure() && !cancelled() && inputs.run-vllm-upstream-test }}
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-vllm-upstream-test-${{ inputs.config-file }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/vllm.tests-upstream.yml
    with:
      config-file: ${{ inputs.config-file }}
      image-uri: ${{ needs.build.outputs.image-uri || '' }}
    secrets: inherit

  release-gate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (contains(github.workflow_ref, '.autorelease') || contains(github.workflow_ref, '.dispatch-release')) &&
      !contains(github.workflow_ref, '.pr') &&
      inputs.release &&
      !failure() && !cancelled() &&
      needs.build.result == 'success'
    needs: [build, sanity-test, security-test, telemetry-test, validation-test, managed-instances-test, sglang-upstream-test, vllm-upstream-test]
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      release-spec: ${{ steps.spec.outputs.release-spec }}
      environment: ${{ steps.check.outputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          SHOULD_RELEASE=$(yq '.release.release' "${{ inputs.config-file }}")
          ENVIRONMENT=$(yq '.release.environment' "${{ inputs.config-file }}")
          echo "should-release=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
      - id: spec
        if: steps.check.outputs.should-release == 'true'
        uses: ./.github/actions/generate-release-spec
        with:
          config-file: ${{ inputs.config-file }}

  release:
    if: ${{ !failure() && !cancelled() && needs.release-gate.outputs.should-release == 'true' }}
    needs: [build, release-gate]
    uses: ./.github/workflows/_reusable.release-image.yml
    with:
      source-image-uri: ${{ needs.build.outputs.image-uri }}
      release-spec: ${{ needs.release-gate.outputs.release-spec }}
      environment: ${{ needs.release-gate.outputs.environment }}
      aws-region: ${{ vars.AWS_REGION }}
    secrets: inherit

  notify-failure:
    # Notify Slack immediately when an auto-release/dispatch-release run fails.
    # Guarded on release context so PR runs never notify.
    if: >-
      failure() &&
      github.ref == 'refs/heads/main' &&
      (contains(github.workflow_ref, '.autorelease') || contains(github.workflow_ref, '.dispatch-release')) &&
      !contains(github.workflow_ref, '.pr') &&
      inputs.release
    needs: [build, sanity-test, security-test, telemetry-test, validation-test, managed-instances-test, sglang-upstream-test, vllm-upstream-test, release-gate, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_RELEASE_FAILURE_WEBHOOK_URL }}
          workflow-name: ${{ github.workflow }}
          config-file: ${{ inputs.config-file }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

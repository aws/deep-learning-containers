name: "Dispatch Release - vLLM SageMaker ARM64 CPU AL2023"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.discover.outputs.configs }}
    steps:
      - uses: actions/checkout@v6
      - id: discover
        uses: ./.github/actions/discover-configs
        with:
          pattern: ".github/config/image/vllm/sagemaker-arm64-amzn2023.yml"

  pipeline:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.configs) }}
    uses: ./.github/workflows/vllm.pipeline.yml
    with:
      config-file: ${{ matrix.config_file }}
      tag-suffix: ${{ github.run_id }}
      # vllm.pipeline.yml only releases from main; other refs release to gamma below.
      release: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit

  release-gate:
    if: ${{ github.ref != 'refs/heads/main' }}
    needs: [discover, pipeline]
    runs-on: ubuntu-latest
    outputs:
      config-file: ${{ steps.check.outputs.config-file }}
      release-spec: ${{ steps.spec.outputs.release-spec }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        env:
          CONFIGS: ${{ needs.discover.outputs.configs }}
        run: |
          CONFIG_FILE=$(echo "${CONFIGS}" | jq -r '.[0].config_file')
          ENVIRONMENT=$(yq '.release.environment' "${CONFIG_FILE}")
          if [[ "${ENVIRONMENT}" != "gamma" ]]; then
            echo "::error::Releases from ${GITHUB_REF} are limited to gamma (config environment: ${ENVIRONMENT})"
            exit 1
          fi
          echo "config-file=${CONFIG_FILE}" >> $GITHUB_OUTPUT
      - id: spec
        uses: ./.github/actions/generate-release-spec
        with:
          config-file: ${{ steps.check.outputs.config-file }}

  release:
    needs: [pipeline, release-gate]
    uses: ./.github/workflows/_reusable.release-image.yml
    with:
      source-image-uri: ${{ needs.pipeline.outputs.image-uri }}
      release-spec: ${{ needs.release-gate.outputs.release-spec }}
      environment: gamma
      aws-region: ${{ vars.AWS_REGION }}
    secrets: inherit

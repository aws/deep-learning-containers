name: Reusable vLLM-Omni SageMaker Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

  endpoint-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    # Split the suite across independent jobs, each on its own fresh runner.
    # The CodeBuild runner's role session has a hard ~1h max lifetime that
    # cannot be refreshed past its ceiling; running every endpoint test in one
    # job serialized to ~55 min, so the async tests (which start last and then
    # do an S3 PutObject after a ~40 min InService wait) hit ExpiredToken.
    # Each matrix leg is a separate job with a fresh session, so each test
    # group starts at t=0 with a full-lifetime token.
    strategy:
      fail-fast: false
      matrix:
        group:
          # Unit tests (middleware, no endpoint) + fast real-time endpoint
          # transports: buffered + response-stream (one endpoint) and the two
          # bidirectional-WebSocket tests. `-k` deselects only the slow async
          # endpoint tests so everything else here — including all of
          # test_sagemaker_middleware.py — still runs.
          - name: realtime
            filter: "not test_async_endpoint"
          # Slow async-inference tests only: each deploys its own endpoint and
          # waits ~40 min for InService before its first S3 upload.
          - name: async
            filter: "test_async_endpoint"
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: ECR login
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt
          uv pip install -r test/vllm-omni/sagemaker/requirements.txt

      - name: Run SageMaker endpoint tests (${{ matrix.group.name }})
        run: |
          source .venv/bin/activate
          cd test/
          python3 -m pytest -vs -rA --image-uri ${{ needs.preflight.outputs.image-uri }} \
            -k "${{ matrix.group.filter }}" \
            vllm-omni/sagemaker

name: Reusable vLLM-Omni SageMaker Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""
      image-content-hash:
        description: "Image hash computed from hash_image_content.py for caching a test pass."
        required: false
        type: string
        default: ""
      suite-code-hash:
        description: "Test code hash computed from hash_suite_code.py for caching a test pass."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

  middleware-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt
          uv pip install -r test/vllm-omni/sagemaker/requirements.txt

      - name: Run SageMaker middleware and instance-pool tests
        run: |
          source .venv/bin/activate
          cd test/
          python3 -m pytest -vs -rA \
            test_utils/test_instance_capacity.py \
            vllm-omni/sagemaker/test_sagemaker_middleware.py

  # Fan out one job per real endpoint case so a failure can be re-run in
  # isolation and every deploy starts with a fresh runner role session.
  # max-parallel: 1 matches the vLLM endpoint-matrix pattern: at most one
  # SageMaker endpoint is live at a time. fail-fast: false lets every case run
  # even after one fails.
  endpoint-test:
    name: endpoint-test (${{ matrix.test.name }})
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test:
          - name: tts-realtime
            node: "vllm-omni/sagemaker/test_sm_omni_endpoint.py::test_vllm_omni_tts_endpoint"
          - name: tts-async
            node: "vllm-omni/sagemaker/test_sm_omni_endpoint.py::test_vllm_omni_tts_async_endpoint"
          - name: video-async
            node: "vllm-omni/sagemaker/test_sm_omni_endpoint.py::test_vllm_omni_video_async_endpoint"
          - name: bidi-speech-stream
            node: "vllm-omni/sagemaker/test_sm_omni_bidi_endpoint.py::test_vllm_omni_bidi_speech_stream"
          - name: bidi-default-path-rejected
            node: "vllm-omni/sagemaker/test_sm_omni_bidi_endpoint.py::test_vllm_omni_bidi_default_path_rejected"
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt
          uv pip install -r test/vllm-omni/sagemaker/requirements.txt

      - name: Run SageMaker endpoint test
        run: |
          source .venv/bin/activate
          cd test/
          python3 -m pytest -vs -rA --image-uri ${{ needs.preflight.outputs.image-uri }} \
            "${{ matrix.test.node }}"

  # Record a PASS row in the ci-images-table if the test suite passed.
  record-test-pass:
    if: >-
      ${{ always() && !cancelled() && !failure() &&
          inputs.image-content-hash != '' && inputs.suite-code-hash != '' &&
          needs.middleware-test.result == 'success' &&
          needs.endpoint-test.result == 'success' }}
    needs: [middleware-test, endpoint-test]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/record-test-pass
        with:
          suite: vllm-omni/sagemaker
          image-content-hash: ${{ inputs.image-content-hash }}
          suite-code-hash: ${{ inputs.suite-code-hash }}
          ci-image-uri: ${{ inputs.image-uri }}
          ci-images-table-account-id: ${{ vars.CI_IMAGES_TABLE_ACCOUNT_ID }}

name: Reusable TensorFlow Training Single-GPU Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""
      image-content-hash:
        required: false
        type: string
        default: ""
      suite-code-hash:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  single-gpu-test:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:x86-g6xl-runner
        buildspec-override:true
    outputs:
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: ECR login
        if: steps.check.outputs.exists == 'true'
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ steps.image.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Derive framework short version
        if: steps.check.outputs.exists == 'true'
        id: fw
        run: |
          FRAMEWORK_VERSION=$(yq '.metadata.framework_version' '${{ inputs.config-file }}')
          SHORT_VERSION=$(echo "${FRAMEWORK_VERSION}" | cut -d. -f1,2)
          echo "short-version=${SHORT_VERSION}" >> $GITHUB_OUTPUT

      - name: Run single-GPU tests
        if: steps.check.outputs.exists == 'true'
        run: |
          CONTAINER_ID=$(docker run -d --rm --gpus all --shm-size=2g \
            --entrypoint /bin/bash \
            -v $(pwd):/workdir --workdir /workdir \
            ${{ steps.image.outputs.image-uri }} -c 'sleep infinity')
          echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV
          docker exec ${CONTAINER_ID} pip install -r /workdir/test/requirements.txt -q
          docker exec \
            -e PYTHONPATH=/workdir/test \
            -e DLC_WORKDIR=/workdir \
            -e DLC_TENSORFLOW_VERSION=${{ steps.fw.outputs.short-version }} \
            ${CONTAINER_ID} \
            pytest /workdir/test/tensorflow/single_gpu/ -v
          docker kill ${CONTAINER_ID}

  # The same image on a Blackwell GPU (EC2 g7.2xlarge, sm_120) for images built
  # with sm_120: GPU check, single-GPU and unit suites with CUDA_DISABLE_PTX_JIT=1
  # (test/tensorflow/blackwell_ec2/). The instance comes from the CI G7 capacity
  # reservation (repo variable ODCR_ID_G7_2XLARGE) when it has a free instance,
  # else on demand, so the job never fails the workflow (continue-on-error).
  single-gpu-test-blackwell:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Check for Blackwell build
        id: fw
        run: |
          FRAMEWORK_VERSION=$(yq '.metadata.framework_version' '${{ inputs.config-file }}')
          echo "version=${FRAMEWORK_VERSION}" >> $GITHUB_OUTPUT
          echo "short-version=$(echo "${FRAMEWORK_VERSION}" | cut -d. -f1,2)" >> $GITHUB_OUTPUT
          if yq -r '.build.cuda_compute_capabilities // ""' '${{ inputs.config-file }}' | grep -q 'sm_120'; then
            echo "blackwell=true" >> $GITHUB_OUTPUT
          else
            echo "blackwell=false" >> $GITHUB_OUTPUT
          fi

      - name: Install test dependencies
        if: steps.check.outputs.exists == 'true' && steps.fw.outputs.blackwell == 'true'
        run: pip install -r test/requirements.txt

      - name: Run GPU tests on EC2 G7 (Blackwell)
        id: tests
        if: steps.check.outputs.exists == 'true' && steps.fw.outputs.blackwell == 'true'
        continue-on-error: true
        timeout-minutes: 90
        env:
          PYTHONPATH: ${{ github.workspace }}/test
          BLACKWELL_ODCR_ID: ${{ vars.ODCR_ID_G7_2XLARGE }}
          DLC_TENSORFLOW_VERSION: ${{ steps.fw.outputs.short-version }}
          DLC_TENSORFLOW_FULL_VERSION: ${{ steps.fw.outputs.version }}
        run: |
          pytest test/tensorflow/blackwell_ec2/ -v -s -rA \
            --image-uri "${{ steps.image.outputs.image-uri }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Report non-blocking failure
        if: ${{ steps.tests.outcome == 'failure' }}
        run: echo "::warning::Blackwell (EC2 g7.2xlarge) GPU tests failed (non-blocking)."

  # Record a PASS row in the ci-images-table if the test passed.
  record-test-pass:
    if: >-
      ${{ always() && !cancelled() && !failure() &&
          inputs.image-content-hash != '' && inputs.suite-code-hash != '' &&
          needs.single-gpu-test.result == 'success' &&
          needs.single-gpu-test.outputs.image-exists == 'true' }}
    needs: [single-gpu-test]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/record-test-pass
        with:
          suite: tensorflow-training/single_gpu
          image-content-hash: ${{ inputs.image-content-hash }}
          suite-code-hash: ${{ inputs.suite-code-hash }}
          ci-image-uri: ${{ inputs.image-uri }}
          ci-images-table-account-id: ${{ vars.CI_IMAGES_TABLE_ACCOUNT_ID }}

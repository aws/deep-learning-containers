name: Reusable PyTorch SageMaker Tests

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
      # Test-skip decision (computed once, consumed by the test + record jobs).
      skip: ${{ steps.skip.outputs.skip }}
      image-content-hash: ${{ steps.skip.outputs.image-content-hash }}
      suite-code-hash: ${{ steps.skip.outputs.suite-code-hash }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Check test skip
        if: steps.check.outputs.exists == 'true'
        id: skip
        uses: ./.github/actions/check-test-pass
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}
          suite: pytorch/integration/sagemaker
          aws-region: ${{ vars.AWS_REGION }}
          aws-account-id: ${{ steps.image.outputs.aws-account-id }}
          ci-images-table-account-id: ${{ vars.DB_ACCOUNT_ID }}

  sagemaker-test:
    # Launches remote SageMaker training jobs — no GPU needed on the runner.
    if: ${{ needs.preflight.outputs.image-exists == 'true' && needs.preflight.outputs.skip != 'true' }}
    needs: [preflight]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: ECR login
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      - name: Select test file by device type
        id: select
        run: |
          DEVICE=$(yq '.metadata.device_type' '${{ inputs.config-file }}')
          if [ "${DEVICE}" = "gpu" ]; then
            echo "test-file=pytorch/integration/sagemaker/test_sm_training_cuda.py" >> $GITHUB_OUTPUT
          else
            echo "test-file=pytorch/integration/sagemaker/test_sm_training_cpu.py" >> $GITHUB_OUTPUT
          fi

      - name: Run SageMaker training tests
        env:
          TEST_IMAGE_URI: ${{ needs.preflight.outputs.image-uri }}
          SM_ROLE_ARN: arn:aws:iam::${{ vars.CI_AWS_ACCOUNT_ID }}:role/SageMakerRole
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt
          uv pip install -r test/pytorch/integration/sagemaker/requirements.txt
          cd test/
          PYTHONPATH=$(pwd):$PYTHONPATH python3 -m pytest -v --tb=short -rA --log-cli-level=INFO \
            ${{ steps.select.outputs.test-file }}

  sagemaker-record:
    # Record a PASS row for `pytorch/integration/sagemaker` only after the test
    # job succeeds on a MISS. `!cancelled()` keeps this from being auto-skipped;
    # the result check blocks recording a failed run; the skip guard blocks
    # re-recording on a HIT (the test job was gated off).
    needs: [preflight, sagemaker-test]
    if: >-
      !cancelled() &&
      needs.preflight.outputs.skip == 'false' &&
      needs.preflight.outputs.image-content-hash != '' &&
      needs.preflight.outputs.suite-code-hash != '' &&
      needs.sagemaker-test.result == 'success'
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: Record test pass
        uses: ./.github/actions/record-test-pass
        with:
          suite: pytorch/integration/sagemaker
          image-content-hash: ${{ needs.preflight.outputs.image-content-hash }}
          suite-code-hash: ${{ needs.preflight.outputs.suite-code-hash }}
          ci-images-table-account-id: ${{ vars.DB_ACCOUNT_ID }}

name: Reusable Dynamo Image Tests

# CPU-only contract tests run inside the image: Dynamo/backend versions match the config,
# Dynamo modules import, and the EFA flavor has (or lacks) the EFA stack and NIXL fixes.

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""
      image-content-hash:
        description: "Image hash computed from hash_image_content.py for caching a test pass."
        required: false
        type: string
        default: ""
      suite-code-hash:
        description: "Test code hash computed from hash_suite_code.py for caching a test pass."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
      backend: ${{ steps.parse.outputs.backend }}
      dynamo-version: ${{ steps.parse.outputs.dynamo-version }}
      backend-version: ${{ steps.parse.outputs.backend-version }}
      efa-flavor: ${{ steps.parse.outputs.efa-flavor }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

      - name: Parse config
        id: parse
        run: |
          CONFIG_FILE="${{ inputs.config-file }}"
          echo "backend=$(yq '.metadata.backend' "$CONFIG_FILE")" >> $GITHUB_OUTPUT
          echo "dynamo-version=$(yq '.metadata.framework_version' "$CONFIG_FILE")" >> $GITHUB_OUTPUT
          echo "backend-version=$(yq '.metadata.backend_version' "$CONFIG_FILE")" >> $GITHUB_OUTPUT
          echo "efa-flavor=$(yq '.build.efa_flavor' "$CONFIG_FILE")" >> $GITHUB_OUTPUT

  image-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6

      - name: ECR login
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      - name: Start container
        run: |
          CONTAINER_ID=$(docker run -d -it --rm --entrypoint /bin/bash \
            -v ./test/dynamo:/test/dynamo:ro \
            -e DYNAMO_BACKEND=${{ needs.preflight.outputs.backend }} \
            -e EXPECTED_DYNAMO_VERSION=${{ needs.preflight.outputs.dynamo-version }} \
            -e EXPECTED_BACKEND_VERSION=${{ needs.preflight.outputs.backend-version }} \
            -e EFA_FLAVOR=${{ needs.preflight.outputs.efa-flavor }} \
            ${{ needs.preflight.outputs.image-uri }})
          echo "CONTAINER_ID=${CONTAINER_ID}" >> ${GITHUB_ENV}

      - name: Install pytest
        run: |
          # Outside the image's environment, so the lock comparison sees only what the image ships.
          docker exec ${CONTAINER_ID} uv pip install -q --target /tmp/test-deps pytest

      - name: Run image tests
        run: |
          docker exec -e PYTHONPATH=/tmp/test-deps ${CONTAINER_ID} python3 -m pytest -v -rA -p no:cacheprovider /test/dynamo/test_image.py

      - name: Cleanup
        if: always()
        run: docker rm -f ${CONTAINER_ID} 2>/dev/null || true

  # Record a PASS row in the ci-images-table if the test passed.
  record-test-pass:
    if: >-
      ${{ always() && !cancelled() && !failure() &&
          inputs.image-content-hash != '' && inputs.suite-code-hash != '' &&
          needs.image-test.result == 'success' }}
    needs: [image-test]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/record-test-pass
        with:
          suite: dynamo/image
          image-content-hash: ${{ inputs.image-content-hash }}
          suite-code-hash: ${{ inputs.suite-code-hash }}
          ci-image-uri: ${{ inputs.image-uri }}
          ci-images-table-account-id: ${{ vars.CI_IMAGES_TABLE_ACCOUNT_ID }}

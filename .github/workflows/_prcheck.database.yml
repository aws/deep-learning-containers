name: Database Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci/test_skip/**"
      - "test/db/**"
      - ".github/config/test-suites.yml"
      - ".github/workflows/_prcheck.database.yml"

permissions:
  contents: read

jobs:
  database-tests:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v6

      - name: Setup python
        run: |
          uv venv --python 3.12
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Install test dependencies
        run: uv pip install pytest boto3 moto pyyaml

      # loads only test/db conftest and excludes the container-test
      # harness (which imports test_utils and is not needed here).
      - name: Run database unit tests
        run: python -m pytest test/db --confcutdir test/db -v

name: "strands-decider - GPU Serving Tests"

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to image config YAML"
        required: true
        type: string
      image-uri:
        description: "Image URI to test. If empty, derives prod URI from config."
        required: false
        type: string
        default: ""
      image-content-hash:
        description: "Image hash computed from hash_image_content.py for caching a test pass."
        required: false
        type: string
        default: ""
      suite-code-hash:
        description: "Test code hash computed from hash_suite_code.py for caching a test pass."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      aws-account-id: ${{ steps.image.outputs.aws-account-id }}
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image URI
        id: image
        uses: ./.github/actions/resolve-image-uri
        with:
          image-uri: ${{ inputs.image-uri }}
          ci-aws-account-id: ${{ vars.CI_AWS_ACCOUNT_ID }}
          prod-aws-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          config-file: ${{ inputs.config-file }}

      - name: Check image exists
        id: check
        uses: ./.github/actions/check-image-exists
        with:
          image-uri: ${{ steps.image.outputs.image-uri }}

  serving-test:
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qwen3.5 (Gated DeltaNet: Triton kernels, causal-conv1d) on one L4.
          - model: strands-decider-2B-qwen3.5-v1-2610
            fleet: x86-g6xl-runner
            device-map: ""
          # Gemma 4 on one L4.
          - model: strands-decider-E2B-gemma4-v1-2610
            fleet: x86-g6xl-runner
            device-map: ""
          - model: strands-decider-E4B-gemma4-v1-2610
            fleet: x86-g6xl-runner
            device-map: ""
          # About 25 GB of weights, more than an L4: one L40S.
          - model: strands-decider-12B-gemma4-v1-2610
            fleet: x86-g6exl-runner
            device-map: ""
          # About 51 GB of weights, more than one GPU: split across the L40S GPUs of a g6e.48xlarge.
          - model: strands-decider-26B-A4B-gemma4-v1-2610
            fleet: x86-g6e48xl-runner
            device-map: auto
    # The L40S fleets are self-hosted runners, not CodeBuild fleets: x86-g6exl-runner (1x L40S) -> gpu-l40s-1x,
    # x86-g6e12xl-runner (4x) -> gpu-l40s-4x, x86-g6e48xl-runner (8x) -> gpu-l40s-8x.
    runs-on: ${{ (matrix.fleet == 'x86-g6exl-runner' && fromJSON('["self-hosted", "gpu-l40s-1x"]')) || (matrix.fleet == 'x86-g6e12xl-runner' && fromJSON('["self-hosted", "gpu-l40s-4x"]')) || (matrix.fleet == 'x86-g6e48xl-runner' && fromJSON('["self-hosted", "gpu-l40s-8x"]')) || format('codebuild-runner-{0}-{1} fleet:{2} buildspec-override:true', github.run_id, github.run_attempt, matrix.fleet) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: ECR login
        uses: ./.github/actions/ecr-authenticate
        with:
          aws-account-id: ${{ needs.preflight.outputs.aws-account-id }}
          aws-region: ${{ vars.AWS_REGION }}
          image-uri: ${{ needs.preflight.outputs.image-uri }}

      # The tarball holds what SageMaker puts in /opt/ml/model: the checkpoint folder and base/, the base model.
      - name: Download model
        id: model
        uses: ./.github/actions/download-model
        with:
          s3-path: s3://dlc-cicd-models/strands-decider-models/${{ matrix.model }}.tar.gz
          model-name: ${{ matrix.model }}

      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r test/requirements.txt

      - name: Start the server as SageMaker does
        run: |
          # TEMPORARY: bypasses buggy `cuda>=13.3` label check in
          # nvidia-container-toolkit 1.19.1 (fixed upstream in v1.20.0).
          # Remove flag + this comment once the runner AMI ships toolkit >= 1.20.
          CONTAINER_ID=$(docker run -d --gpus all -e NVIDIA_DISABLE_REQUIRE=true -p 8080:8080 \
            -v ${{ steps.model.outputs.model-dir }}:/opt/ml/model:ro \
            -e DECIDER_CHECKPOINT=/opt/ml/model/${{ matrix.model }} \
            -e DECIDER_DEVICE_MAP=${{ matrix.device-map }} \
            ${{ needs.preflight.outputs.image-uri }} serve)
          echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV
          # Loading and the warm-up take 1 to 3 minutes; /ping fails until both are done.
          for _ in $(seq 1 180); do
            curl -sf localhost:8080/ping >/dev/null && { echo "server up"; exit 0; }
            [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null)" = true ] || break
            sleep 5
          done
          echo "server did not come up"; docker logs --tail 100 "$CONTAINER_ID" || true
          exit 1

      - name: Run serving tests
        env:
          ENDPOINT_URL: http://localhost:8080
          EXPECTED_MODEL: ${{ matrix.model }}
        run: |
          source .venv/bin/activate
          cd test/
          python3 -m pytest -v --tb=short -rA strands-decider/gpu/

      - name: Server logs
        if: always()
        run: docker logs "$CONTAINER_ID" 2>&1 | grep -v "Loading weights" | tail -100 || true

      - name: Stop server and release model lock
        if: always()
        run: |
          docker rm -f "$CONTAINER_ID" 2>/dev/null || true
          # Self-hosted runners keep their disk between jobs.
          docker rmi ${{ needs.preflight.outputs.image-uri }} 2>/dev/null || true
          if [[ -n "${{ steps.model.outputs.lock-pid }}" ]]; then
            kill "${{ steps.model.outputs.lock-pid }}" 2>/dev/null || true
          fi

  # Record a PASS row in the ci-images-table if the test passed.
  record-test-pass:
    if: >-
      ${{ always() && !cancelled() && !failure() &&
          inputs.image-content-hash != '' && inputs.suite-code-hash != '' &&
          needs.serving-test.result == 'success' }}
    needs: [serving-test]
    runs-on:
      - codebuild-runner-${{ github.run_id }}-${{ github.run_attempt }}
        fleet:default-runner
        buildspec-override:true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/record-test-pass
        with:
          suite: strands-decider/gpu
          image-content-hash: ${{ inputs.image-content-hash }}
          suite-code-hash: ${{ inputs.suite-code-hash }}
          ci-image-uri: ${{ inputs.image-uri }}
          ci-images-table-account-id: ${{ vars.CI_IMAGES_TABLE_ACCOUNT_ID }}

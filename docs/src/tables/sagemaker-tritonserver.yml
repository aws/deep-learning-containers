# Table Configuration - SageMaker Triton Server

# Show only the latest N releases in available_images.md (full list on Support Policy).
max_versions: 2
columns:
  - field: framework_version
    header: "Framework"
  - field: python
    header: "Python"
  - field: accelerator
    header: "Accelerator"
  - field: platform
    header: "Platform"
  - field: example_uri
    header: "Example URI"

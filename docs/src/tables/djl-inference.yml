# Table Configuration - DJL Inference

# Keep only the latest N images per accelerator in available_images.md.
accelerator_limits:
  cpu: 1
columns:
  - field: framework_version
    header: "Framework"
  - field: cuda
    header: "CUDA"
  - field: engine
    header: "Engine"
  - field: accelerator
    header: "Accelerator"
  - field: platform
    header: "Platform"
  - field: example_uri
    header: "Example URI"

tiebreakers:
  - platform_sorter
  - accelerator_sorter
  - engine_sorter

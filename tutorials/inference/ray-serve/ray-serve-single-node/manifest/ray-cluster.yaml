# qwen_serve.py is provided via a ConfigMap created by deploy_ray_cluster.sh.
# Variables: ${NAMESPACE}, ${DLC_IMAGE}, ${RAY_CLUSTER_NAME}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${RAY_CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ray-serve
  template:
    metadata:
      labels:
        app: ray-serve
    spec:
      containers:
        - name: ray-serve
          image: ${DLC_IMAGE}
          command:
            - bash
            - -c
            - |
              ray start --head --num-gpus=1 &
              sleep 5
              serve start --http-port=8000
              serve run qwen_serve:app --app-dir /app
          ports:
            - containerPort: 8000
              name: serve
          resources:
            limits:
              nvidia.com/gpu: "1"
              cpu: "1500m"
              memory: "8Gi"
            requests:
              nvidia.com/gpu: "1"
              cpu: "1"
              memory: "6Gi"
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          volumeMounts:
            - name: qwen-serve-code
              mountPath: /app
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: qwen-serve-code
          configMap:
            name: qwen-serve-code
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
      nodeSelector:
        role: gpu-worker
